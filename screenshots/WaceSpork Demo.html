function openCropModal(sourceImage, onSave){
  const BOX = 280; const OUT = 256;
  const iw = sourceImage.naturalWidth || sourceImage.width;
  const ih = sourceImage.naturalHeight || sourceImage.height;
  const baseScale = Math.max(BOX / iw, BOX / ih);
  let zoom = 1; let scale = baseScale;
  let ox = (BOX - iw * scale) / 2; let oy = (BOX - ih * scale) / 2;
  const clamp = ()=>{ const w = iw*scale, h = ih*scale; ox = Math.min(0, Math.max(BOX - w, ox)); oy = Math.min(0, Math.max(BOX - h, oy)); };
  clamp();
  let api = null;
  const applyTransform = ()=>{ if(!api) return; const img = $("#crop-img", api.modal); if(!img) return;
    img.style.width = (iw*scale)+"px"; img.style.height = (ih*scale)+"px";
    img.style.transform = `translate(${ox}px, ${oy}px)`; };
  api = UI.openModal({
    title: "Crop Profile Picture",
    body: `
      <div class="crop-box" id="crop-box"><img id="crop-img" alt="" draggable="false"></div>
      <div class="field"><label class="label" for="crop-zoom">Zoom</label>
        <input class="input" id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1"></div>
      <div class="crop-hint">Drag to reposition · use the slider to zoom</div>`,
    actions: [
      { label:"Cancel", variant:"ghost", onClick:()=>onSave(null) },
      { label:"Apply", variant:"primary", onClick:()=>{
        const canvas = document.createElement("canvas"); canvas.width=OUT; canvas.height=OUT;
        const ctx = canvas.getContext("2d");
        const sx = -ox/scale, sy = -oy/scale, sw = BOX/scale, sh = BOX/scale;
        ctx.drawImage(sourceImage, sx, sy, sw, sh, 0, 0, OUT, OUT);
        let dataUrl; try{ dataUrl = canvas.toDataURL("image/jpeg", 0.9); }catch(e){ dataUrl = canvas.toDataURL(); }
        onSave(dataUrl);
      }}
    ],
    onMount: ({ modal })=>{
      const box = $("#crop-box", modal), img = $("#crop-img", modal), slider = $("#crop-zoom", modal);
      img.src = sourceImage.src; applyTransform();
      let dragging=false, startX=0, startY=0, startOx=0, startOy=0;
      box.addEventListener("pointerdown",(e)=>{ dragging=true; try{ box.setPointerCapture(e.pointerId); }catch(err){}
        box.classList.add("grabbing"); startX=e.clientX; startY=e.clientY; startOx=ox; startOy=oy; e.preventDefault(); });
      box.addEventListener("pointermove",(e)=>{ if(!dragging) return;
        ox = startOx + (e.clientX - startX); oy = startOy + (e.clientY - startY); clamp(); applyTransform(); });
      const endDrag = (e)=>{ if(!dragging) return; dragging=false; try{ box.releasePointerCapture(e.pointerId); }catch(err){} box.classList.remove("grabbing"); };
      box.addEventListener("pointerup", endDrag); box.addEventListener("pointercancel", endDrag);
      slider.addEventListener("input", ()=>{
        const newZoom = parseFloat(slider.value);
        const cx = BOX/2, cy = BOX/2; const sourceX = (cx - ox)/scale; const sourceY = (cy - oy)/scale;
        zoom = newZoom; scale = baseScale * zoom; ox = cx - sourceX*scale; oy = cy - sourceY*scale;
        clamp(); applyTransform(); });
    }
  });
}
async function processAppIcon(file){
  const dataUrl = await readFileAsDataUrl(file);
  const img = await loadImage(dataUrl);
  const MAX = 256;
  let w = img.naturalWidth || img.width;
  let h = img.naturalHeight || img.height;
  if(!w || !h) return dataUrl;
  const scale = Math.min(1, MAX / Math.max(w, h));
  w = Math.max(1, Math.round(w * scale));
  h = Math.max(1, Math.round(h * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, w, h);
  let hasAlpha = false;
  try{
    const d = ctx.getImageData(0, 0, w, h).data;
    for(let i = 3; i < d.length; i += 16){ if(d[i] < 250){ hasAlpha = true; break; } }
  }catch(e){ hasAlpha = true; }
  const out = hasAlpha ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.85);
  const size = base64DataUrlBytes(out);
  if(size > 300 * 1024) throw new Error("Icon is too large after compression (" + formatBytes(size) + "). Try a smaller image.");
  return out;
}

function handleFsWrite(bucket, data, reply){
  const path = String(data.path || "").trim().slice(0, 200);
  if(!path){ reply({ ok:false, error:"A file path is required." }); return; }
  const declaredMime = typeof data.mime === "string" ? data.mime.slice(0, 120) : "";
  const mime     = declaredMime || guessMime(path);
  const encoding = data.encoding === "base64" ? "base64" : "utf8";
  const content  = typeof data.content === "string" ? data.content : "";
  const rawSize  = encoding === "utf8" ? utf8Bytes(content) : fsBase64Bytes(content);
  if(rawSize > APP_FILE_MAX_BYTES){
    reply({ ok:false, error:`File is too large: ${formatBytes(rawSize)} exceeds the ${formatBytes(APP_FILE_MAX_BYTES)} per-file cap.` });
    return;
  }
  let totalExcl = 0;
  Object.keys(bucket.files).forEach((k)=>{ if(k !== path) totalExcl += Number(bucket.files[k].size) || 0; });
  if(totalExcl + rawSize > APP_FILES_TOTAL_MAX){
    reply({ ok:false, error:`This app's file storage is full (${formatBytes(APP_FILES_TOTAL_MAX)} cap). Delete a file first.` });
    return;
  }
  const existing = bucket.files[path];
  const oldRaw = existing ? Number(existing.size) || 0 : 0;
  const oldMultiplier = existing && existing.encoding === "base64" ? 1.78 : 1.34;
  const oldDelta = Math.round(oldRaw * oldMultiplier);
  const multiplier = encoding === "base64" ? 1.78 : 1.34;
  const delta = Math.round(rawSize * multiplier);
  const projected = estimateBackupBytes() - oldDelta + delta;
  if(projected > STORAGE_LIMIT_BYTES){
    reply({ ok:false, error:`Not enough workspace storage. This file would push estimated usage to ${formatBytes(projected)} of the ${formatBytes(STORAGE_LIMIT_BYTES)} budget. Free up space or reduce the file.` });
    return;
  }
  const now = nowISO();
  bucket.files[path] = {
    name: path, mime, size: rawSize, encoding, content,
    createdAt: existing ? existing.createdAt : now,
    modifiedAt: now
  };
  Store.save();
  if(rawSize > APP_FILE_WARN_BYTES){
    UI.toast(`Large app file “${path}” (${formatBytes(rawSize)}) — uses about ${formatBytes(delta)} of your workspace budget.`, "info");
  }
  const m = bucket.files[path];
  reply({ ok:true, data:{ path, name:m.name, mime:m.mime, size:m.size, encoding:m.encoding, createdAt:m.createdAt, modifiedAt:m.modifiedAt }, manifest: buildFileManifest(bucket.files) });
}
function handleFsRead(bucket, data, reply){
  const path = String(data.path || "");
  const f = bucket.files[path];
  if(!f){ reply({ ok:false, error:"File not found: " + path }); return; }
  reply({ ok:true, data:{ path, name:f.name, mime:f.mime, size:f.size, encoding:f.encoding, content:f.content, createdAt:f.createdAt, modifiedAt:f.modifiedAt } });
}
function handleFsDelete(bucket, data, reply){
  const path = String(data.path || "");
  if(!(path in bucket.files)){ reply({ ok:true, data:{ deleted:false }, manifest: buildFileManifest(bucket.files) }); return; }
  delete bucket.files[path]; Store.save();
  reply({ ok:true, data:{ deleted:true }, manifest: buildFileManifest(bucket.files) });
}
function handleFsClear(bucket, reply){
  bucket.files = {}; Store.save();
  reply({ ok:true, data:{ cleared:true }, manifest: {} });
}
function buildAppStorageShim(initial){
  const manifest = buildFileManifest((initial && initial.files) || {});
  const initialJSON = JSON.stringify({
    local: (initial && initial.local) || {},
    session: (initial && initial.session) || {},
    files: manifest
  });
  const safeInitial = initialJSON.replace(/</g, "\\u003c");
  const OPEN = "<" + "script" + ">";
  const CLOSE = "<" + "/" + "script" + ">";
  const parts = [];
  parts.push(OPEN);
  parts.push('(function(){');
  parts.push('try{');
  parts.push('var __ws_initial = ' + safeInitial + ';');
  parts.push('var __ws_post = function(m){ try{ parent.postMessage(m, "*"); }catch(e){} };');
  parts.push('function __ws_makeStorage(area){');
  parts.push('  var data = {};');
  parts.push('  var src = __ws_initial[area] || {};');
  parts.push('  for(var k in src){ if(Object.prototype.hasOwnProperty.call(src,k)) data[k] = String(src[k]); }');
  parts.push('  function caps(){');
  parts.push('    var m = {');
  parts.push('      getItem: function(k){ k=String(k); return Object.prototype.hasOwnProperty.call(data,k) ? data[k] : null; },');
  parts.push('      setItem: function(k,v){ k=String(k); v=String(v); data[k]=v; __ws_post({type:"wacespork:storage:set",area:area,key:k,value:v}); },');
  parts.push('      removeItem: function(k){ k=String(k); delete data[k]; __ws_post({type:"wacespork:storage:remove",area:area,key:k}); },');
  parts.push('      clear: function(){ var kk=Object.keys(data); for(var i=0;i<kk.length;i++){ delete data[kk[i]]; } __ws_post({type:"wacespork:storage:clear",area:area}); },');
  parts.push('      key: function(i){ i=Number(i)||0; var ks=Object.keys(data); return (i>=0 && i<ks.length) ? ks[i] : null; }');
  parts.push('    };');
  parts.push('    Object.defineProperty(m, "length", { get: function(){ return Object.keys(data).length; }, configurable: true });');
  parts.push('    return m;');
  parts.push('  }');
  parts.push('  var methods = caps();');
  parts.push('  return new Proxy(methods, {');
  parts.push('    get: function(t,p){');
  parts.push('      if(typeof p === "string" && !(p in t) && Object.prototype.hasOwnProperty.call(data,p)) return data[p];');
  parts.push('      return t[p];');
  parts.push('    },');
  parts.push('    set: function(t,p,v){');
  parts.push('      if(typeof p === "string" && !(p in t)){ data[p]=String(v); __ws_post({type:"wacespork:storage:set",area:area,key:p,value:String(v)}); return true; }');
  parts.push('      t[p]=v; return true;');
  parts.push('    },');
  parts.push('    deleteProperty: function(t,p){');
  parts.push('      if(typeof p === "string" && Object.prototype.hasOwnProperty.call(data,p)){ delete data[p]; __ws_post({type:"wacespork:storage:remove",area:area,key:p}); return true; }');
  parts.push('      return true;');
  parts.push('    },');
  parts.push('    has: function(t,p){ if(typeof p === "string" && Object.prototype.hasOwnProperty.call(data,p)) return true; return p in t; },');
  parts.push('    ownKeys: function(){ return Object.keys(data); },');
  parts.push('    getOwnPropertyDescriptor: function(t,p){ if(Object.prototype.hasOwnProperty.call(data,p)) return { enumerable:true, configurable:true, value:data[p], writable:true }; return undefined; }');
  parts.push('  });');
  parts.push('}');
  parts.push('var __ws_ls = __ws_makeStorage("local");');
  parts.push('var __ws_ss = __ws_makeStorage("session");');
  parts.push('try{ Object.defineProperty(window, "localStorage", { value: __ws_ls, configurable:true, writable:false }); }catch(e1){ try{ window.localStorage = __ws_ls; }catch(e2){} }');
  parts.push('try{ Object.defineProperty(window, "sessionStorage", { value: __ws_ss, configurable:true, writable:false }); }catch(e1){ try{ window.sessionStorage = __ws_ss; }catch(e2){} }');
  parts.push('var __ws_fs_manifest = __ws_initial.files || {};');
  parts.push('var __ws_pending = {};');
  parts.push('var __ws_reqId = 0;');
  parts.push('window.addEventListener("message", function(e){');
  parts.push('  var d = e.data;');
  parts.push('  if(!d || d.type !== "wacespork:fs:response") return;');
  parts.push('  var p = __ws_pending[d.requestId]; if(!p) return;');
  parts.push('  delete __ws_pending[d.requestId];');
  parts.push('  if(d.ok){ if(d.manifest) __ws_fs_manifest = d.manifest; p.resolve(d.data); } else { p.reject(new Error(d.error || "fs error")); }');
  parts.push('});');
  parts.push('function __ws_fs_send(type, payload){');
  parts.push('  return new Promise(function(resolve, reject){');
  parts.push('    var id = ++__ws_reqId;');
  parts.push('    __ws_pending[id] = { resolve: resolve, reject: reject };');
  parts.push('    var msg = { type: "wacespork:fs:" + type, requestId: id };');
  parts.push('    for(var k in payload){ if(Object.prototype.hasOwnProperty.call(payload,k)) msg[k] = payload[k]; }');
  parts.push('    try{ parent.postMessage(msg, "*"); }catch(e){ reject(e); }');
  parts.push('  });');
  parts.push('}');
  parts.push('function __ws_bytesToBase64(bytes){ var bin=""; var C=0x8000; for(var i=0;i<bytes.length;i+=C){ bin += String.fromCharCode.apply(null, bytes.subarray(i,i+C)); } return btoa(bin); }');
  parts.push('function __ws_base64ToBytes(b64){ var bin=atob(b64); var u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }');
  parts.push('function __ws_doWrite(p, binaryOrStr, isBinary, mime){');
  parts.push('  var payload;');
  parts.push('  if(isBinary){ payload = { path:p, mime:mime, encoding:"base64", content:__ws_bytesToBase64(binaryOrStr) }; }');
  parts.push('  else { payload = { path:p, mime:mime, encoding:"utf8", content:binaryOrStr }; }');
  parts.push('  return __ws_fs_send("write", payload);');
  parts.push('}');
  parts.push('var waceSpork = window.waceSpork = window.waceSpork || {};');
  parts.push('waceSpork.fs = {');
  parts.push('  listFiles: function(){ var out=[]; for(var k in __ws_fs_manifest){ if(Object.prototype.hasOwnProperty.call(__ws_fs_manifest,k)){ var m=__ws_fs_manifest[k]; out.push({ path:k, name:m.name, mime:m.mime, size:m.size, encoding:m.encoding, createdAt:m.createdAt, modifiedAt:m.modifiedAt }); } } return out; },');
  parts.push('  exists: function(p){ return Object.prototype.hasOwnProperty.call(__ws_fs_manifest, String(p)); },');
  parts.push('  getMetadata: function(p){ var m = __ws_fs_manifest[String(p)]; return m ? { path:String(p), name:m.name, mime:m.mime, size:m.size, encoding:m.encoding, createdAt:m.createdAt, modifiedAt:m.modifiedAt } : null; },');
  parts.push('  writeFile: function(p, data, options){');
  parts.push('    options = options || {};');
  parts.push('    p = String(p||"").trim();');
  parts.push('    if(!p) return Promise.reject(new Error("A file path is required."));');
  parts.push('    var mime = options.mime || null;');
  parts.push('    if(typeof data === "string") return __ws_doWrite(p, data, false, mime);');
  parts.push('    if(data instanceof Uint8Array) return __ws_doWrite(p, data, true, mime);');
  parts.push('    if(data instanceof ArrayBuffer) return __ws_doWrite(p, new Uint8Array(data), true, mime);');
  parts.push('    if(data && typeof data.arrayBuffer === "function") return data.arrayBuffer().then(function(buf){ return __ws_doWrite(p, new Uint8Array(buf), true, mime); });');
  parts.push('    return Promise.reject(new Error("Unsupported data type for writeFile — pass a string, Blob, ArrayBuffer or Uint8Array."));');
  parts.push('  },');
  parts.push('  readFile: function(p){ return __ws_fs_send("read", { path:String(p) }).then(function(r){');
  parts.push('    var out = { path:r.path, name:r.name, mime:r.mime, size:r.size, encoding:r.encoding, createdAt:r.createdAt, modifiedAt:r.modifiedAt };');
  parts.push('    if(r.encoding === "utf8"){ out.text = r.content; out.base64 = null; }');
  parts.push('    else { out.text = null; out.base64 = r.content; }');
  parts.push('    out.bytes = function(){ return r.encoding === "utf8" ? new TextEncoder().encode(r.content) : __ws_base64ToBytes(r.content); };');
  parts.push('    out.blob = function(){ return new Blob([out.bytes()], { type: r.mime || "application/octet-stream" }); };');
  parts.push('    return out;');
  parts.push('  }); },');
  parts.push('  deleteFile: function(p){ return __ws_fs_send("delete", { path:String(p) }); },');
  parts.push('  clearAll: function(){ return __ws_fs_send("clear", {}); },');
  parts.push('  decodeBase64: function(b64){ return __ws_base64ToBytes(b64); },');
  parts.push('  encodeBase64: function(bytes){ return __ws_bytesToBase64(bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes)); }');
  parts.push('};');
  parts.push('}catch(err){ try{ console.warn("[WaceSpork] app storage shim failed:", err); }catch(_){} }');
  parts.push('})();');
  parts.push(CLOSE);

}

const HTMLAppPanel = (() => {
  const sessions = new Map();
  const MAX_MINIMIZED = 3;
  const BADGE_LABEL_MAX = 22;
  function truncateBadgeLabel(name){
    const s = String(name || "Imported HTML").trim();
    if(s.length <= BADGE_LABEL_MAX) return s;
    return s.slice(0, BADGE_LABEL_MAX - 1).trimEnd() + "…";
  }
  let activeId = null;
  let badgesHost = null;
  function getBadgesHost(){
    if(!badgesHost || !badgesHost.parentNode) badgesHost = document.getElementById("html-app-badges");
    return badgesHost;
  }
  function minimizedCount(){
    let n = 0;
    sessions.forEach((s)=>{ if(s.state === "minimized") n++; });
    return n;
  }
  function open(app){
    if(!app) return;
    const existing = sessions.get(app.id);
    if(existing){
      if(existing.state === "minimized") restoreById(app.id);
      else focusSession(app.id);
      return;
    }
    if(activeId){
      const ok = hideToBadgeById(activeId);
      if(!ok) return;
    }
    const session = createSession(app);
    sessions.set(app.id, session);
    document.body.appendChild(session.backdrop);
    activeId = app.id;
    applyZoom(session, 1);
  }
  function createSession(app){
    const savedRoot = (Store.data && Store.data.appStorage && Store.data.appStorage[app.id]) || null;
    const saved = {
      local:   (savedRoot && savedRoot.local)   || {},
      session: (savedRoot && savedRoot.session) || {},
      files:   (savedRoot && savedRoot.files)   || {}
    };
    const shim = buildAppStorageShim(saved);
    const wrapped = ensureHtmlShell(app.htmlContent || "", app.name || "Imported HTML", shim);
    const backdrop = document.createElement("div");
    backdrop.className = "html-panel-backdrop";
    const appNameSafe = app.name || "Imported HTML";
    backdrop.innerHTML = `
      <div class="html-panel" role="dialog" aria-modal="false" aria-label="${escapeAttr(appNameSafe)}">
        <div class="html-panel-head">
          <span class="html-panel-title" title="${escapeAttr(appNameSafe)}">${esc(appNameSafe)}</span>
          <div class="html-zoom" role="group" aria-label="Zoom">
            <button type="button" class="icon-btn sm" data-zoom-out aria-label="Zoom out" title="Zoom out (Ctrl −)">${UI.icon("zoom-out","ic-sm")}</button>
            <input type="range" min="50" max="200" step="10" value="100" data-zoom-slider aria-label="Zoom level">
            <button type="button" class="icon-btn sm" data-zoom-in aria-label="Zoom in" title="Zoom in (Ctrl +)">${UI.icon("zoom-in","ic-sm")}</button>
            <button type="button" class="zoom-val" data-zoom-reset title="Reset to 100% (Ctrl 0)">100%</button>
          </div>
          <button type="button" class="icon-btn sm" data-panel-download title="Download HTML" aria-label="Download HTML">${UI.icon("download","ic-sm")}</button>
          <button type="button" class="icon-btn sm" data-panel-max title="Maximize" aria-label="Maximize / Minimize">${UI.icon("maximize","ic-sm")}</button>
          <button type="button" class="icon-btn sm" data-panel-hide title="Hide to badge (Esc)" aria-label="Hide">${UI.icon("window-min","ic-sm")}</button>
          <button type="button" class="icon-btn sm danger" data-panel-close title="Close" aria-label="Close">${UI.icon("x","ic-sm")}</button>
        </div>
        <div class="html-panel-body">
          <iframe class="html-panel-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads" srcdoc="${escapeAttr(wrapped)}" title="${escapeAttr(appNameSafe)}"></iframe>
        </div>
      </div>`;
    const session = {
      appId: app.id,
      appName: appNameSafe,
      rawHtml: String(app.htmlContent || ""),
      backdrop,
      panel: $(".html-panel", backdrop),
      iframe: $(".html-panel-frame", backdrop),
      badge: null,
      zoom: 1,
      maximized: false,
      state: "active"
    };
    wireControls(session);
    return session;
  }
  function wireControls(session){
    const b = session.backdrop;
    const zoomSlider = $("[data-zoom-slider]", b);
    const zoomVal = $("[data-zoom-reset]", b);
    zoomSlider.addEventListener("input", ()=>{ const v = Number(zoomSlider.value) || 100; applyZoom(session, v/100); });
    $("[data-zoom-in]", b).addEventListener("click", ()=>applyZoom(session, session.zoom + 0.1));
    $("[data-zoom-out]", b).addEventListener("click", ()=>applyZoom(session, session.zoom - 0.1));
    zoomVal.addEventListener("click", ()=>applyZoom(session, 1));
    $("[data-panel-download]", b).addEventListener("click", ()=>{
      downloadFile((session.appName || "imported") + ".html", ensureHtmlShell(session.rawHtml, session.appName, ""), "text/html");
      UI.toast("HTML file downloaded.","success");
    });
    $("[data-panel-max]", b).addEventListener("click", ()=>toggleMaximizeById(session.appId));
    $("[data-panel-hide]", b).addEventListener("click", ()=>hideToBadgeById(session.appId));
    $("[data-panel-close]", b).addEventListener("click", ()=>closeById(session.appId));
    b.addEventListener("mousedown", (e)=>{ if(e.target === b && !session.maximized) hideToBadgeById(session.appId); });
  }
  function applyZoom(session, z){
    const clamped = Math.max(0.5, Math.min(2, Math.round(z * 100) / 100));
    session.zoom = clamped;
    const pct = Math.round(clamped * 100);
    const body = $(".html-panel-body", session.backdrop);
    if(body) body.style.setProperty("--zoom", String(clamped));
    const zoomSlider = $("[data-zoom-slider]", session.backdrop);
    const zoomVal = $("[data-zoom-reset]", session.backdrop);
    if(zoomSlider) zoomSlider.value = pct;
    if(zoomVal) zoomVal.textContent = pct + "%";
  }
  function toggleMaximizeById(appId){
    const s = sessions.get(appId); if(!s) return;
    s.maximized = !s.maximized;
    s.backdrop.classList.toggle("maximized", s.maximized);
    const btn = $("[data-panel-max]", s.backdrop);
    if(btn){
      btn.title = s.maximized ? "Minimize window" : "Maximize";
      btn.innerHTML = s.maximized ? UI.icon("minimize","ic-sm") : UI.icon("maximize","ic-sm");
    }
  }
  function hideToBadgeById(appId){
    const s = sessions.get(appId); if(!s) return false;
    if(s.state === "minimized") return true;
    if(minimizedCount() >= MAX_MINIMIZED){
      UI.toast("Close a hidden Web-App first (limit " + MAX_MINIMIZED + ").", "error");
      return false;
    }
    s.backdrop.style.display = "none";
    if(!s.badge){
      s.badge = document.createElement("div");
      s.badge.className = "html-panel-badge";
      const shortName = truncateBadgeLabel(s.appName);
      s.badge.innerHTML = `
        <button type="button" class="badge-main" data-badge-restore aria-label="Restore ${escapeAttr(s.appName)}" title="${escapeAttr(s.appName)}">
          <span class="badge-dot" aria-hidden="true"></span>
          <span class="badge-label">${esc(shortName)}</span>
        </button>
        <button type="button" class="badge-x" data-badge-close aria-label="Close ${escapeAttr(s.appName)}" title="Close ${escapeAttr(s.appName)}">${UI.icon("x","ic-sm")}</button>`;
      $("[data-badge-restore]", s.badge).addEventListener("click", ()=>restoreById(appId));
      $("[data-badge-close]", s.badge).addEventListener("click", ()=>closeById(appId));
    }
    const host = getBadgesHost();
    if(host) host.insertBefore(s.badge, host.firstChild);
    s.state = "minimized";
    if(activeId === appId) activeId = null;
    return true;
  }
  function restoreById(appId){
    const s = sessions.get(appId); if(!s) return;
    if(s.state === "active"){ focusSession(appId); return; }
    if(s.badge && s.badge.parentNode) s.badge.parentNode.removeChild(s.badge);
    s.backdrop.style.display = "";
    s.state = "active";
    const prevActive = activeId;
    activeId = appId;
    if(prevActive && prevActive !== appId) hideToBadgeById(prevActive);
    const btn = $("[data-panel-hide]", s.backdrop);
    if(btn) try{ btn.focus(); }catch(e){}
  }
  function focusSession(appId){
    const s = sessions.get(appId); if(!s) return;
    const btn = $("[data-panel-hide]", s.backdrop);
    if(btn) try{ btn.focus(); }catch(e){}
  }
  function closeById(appId){
    const s = sessions.get(appId); if(!s) return;
    if(s.badge && s.badge.parentNode) s.badge.parentNode.removeChild(s.badge);
    if(s.backdrop && s.backdrop.parentNode) s.backdrop.parentNode.removeChild(s.backdrop);
    sessions.delete(appId);
    if(activeId === appId) activeId = null;
  }
  function closeAll(){ Array.from(sessions.keys()).forEach(closeById); }
  function handleKey(e){
    if(!activeId) return;
    const s = sessions.get(activeId); if(!s) return;
    const mod = e.ctrlKey || e.metaKey;
    if(e.key === "Escape"){ e.preventDefault(); hideToBadgeById(activeId); return; }
    if(mod && (e.key === "=" || e.key === "+")){ e.preventDefault(); applyZoom(s, s.zoom + 0.1); return; }
    if(mod && (e.key === "-" || e.key === "_")){ e.preventDefault(); applyZoom(s, s.zoom - 0.1); return; }
    if(mod && e.key === "0"){ e.preventDefault(); applyZoom(s, 1); return; }
    if(mod && e.shiftKey && (e.key === "M" || e.key === "m")){ e.preventDefault(); toggleMaximizeById(activeId); return; }
  }
  document.addEventListener("keydown", handleKey);
  return {
    open,
    close: closeAll,
    getSessionByWindow(win){
      for(const s of sessions.values()){
        try{ if(s.iframe && s.iframe.contentWindow === win) return s; }catch(e){}
      }
      return null;
    }
  };
})();

function wireAppStorageBridge(){
  window.addEventListener("message", (event)=>{
    const session = HTMLAppPanel.getSessionByWindow(event.source);
    if(!session) return;
    const data = event.data;
    if(!data || typeof data !== "object") return;
    const t = data.type;
    if(typeof t !== "string" || t.indexOf("wacespork:storage:") !== 0) return;
    if(!Store.data) return;
    const appId = session.appId;
    if(!appId) return;
    const bucket = ensureAppBucket(appId);
    const area = (data.area === "session") ? "session" : "local";
    try{
      if(t === "wacespork:storage:set"){
        const k = String(data.key == null ? "" : data.key);
        const v = String(data.value == null ? "" : data.value);
        if(k.length > 512) return;
        const size = utf8Bytes(v);
        if(size > APP_STORAGE_MAX_VALUE) return;
        const otherBytes = bucketBytesExcluding(bucket, area, k);
        if(otherBytes + size > APP_STORAGE_MAX_TOTAL) return;
        bucket[area][k] = v;
      } else if(t === "wacespork:storage:remove"){
        delete bucket[area][String(data.key == null ? "" : data.key)];
      } else if(t === "wacespork:storage:clear"){
        bucket[area] = {};
      } else return;
      Store.save();
    }catch(e){ console.error("[WaceSpork] Storage bridge error:", e); }
  });
}
function bucketBytesExcluding(bucket, area, key){
  let total = 0;
  ["local","session"].forEach((a)=>{
    const b = bucket[a] || {};
    Object.keys(b).forEach((k)=>{
      if(a === area && k === key) return;
      total += utf8Bytes(String(b[k]||""));
    });
  });
  return total;
}
function wireAppFileBridge(){
  window.addEventListener("message", (event)=>{
    const session = HTMLAppPanel.getSessionByWindow(event.source);
    if(!session) return;
    const data = event.data;
    if(!data || typeof data !== "object") return;
    const t = data.type;
    if(typeof t !== "string" || t.indexOf("wacespork:fs:") !== 0) return;
    if(!Store.data) return;
    const appId = session.appId; if(!appId) return;
    const requestId = data.requestId; if(!requestId) return;
    const reply = (payload)=>{
      try{ event.source.postMessage({ type:"wacespork:fs:response", requestId, ...payload }, "*"); }catch(e){}
    };
    try{
      const bucket = ensureAppBucket(appId);
      if(t === "wacespork:fs:write")       handleFsWrite(bucket, data, reply);
      else if(t === "wacespork:fs:read")   handleFsRead(bucket, data, reply);
      else if(t === "wacespork:fs:delete") handleFsDelete(bucket, data, reply);
      else if(t === "wacespork:fs:clear")  handleFsClear(bucket, reply);
      else reply({ ok:false, error:"Unknown fs command" });
    }catch(e){
      console.error("[WaceSpork] fs bridge error:", e);
      reply({ ok:false, error: e.message || "File operation failed." });
    }
  });
}
function promptPinFor(title, message){
  return new Promise((resolve)=>{
    const record = Store.securityRecord();
    if(!record){ resolve(""); return; }
    let settled = false;
    const finish = (v)=>{ if(settled) return; settled = true; resolve(v); };
    let pinCtrl = null;
    UI.openModal({
      title: title || "Confirm PIN",
      body: `<div class="info-box" style="margin-bottom:18px">${UI.icon("lock")}
          <span>${esc(message || "Enter your current 6-digit PIN to continue.")}</span></div>
        ${pinInputHtml("pin-prompt","PIN")}
        <div class="pin-error" id="pin-prompt-error"></div>`,
      actions: [
        { label:"Cancel", variant:"ghost", onClick: ()=>{ finish(null); } },
        { label:"Unlock", variant:"primary", onClick: async ({ modal })=>{
          const pin = pinCtrl ? pinCtrl.value() : "";
          const errEl = $("#pin-prompt-error", modal);
          if(!/^\d{6}$/.test(pin)){ errEl.textContent = "Please enter all 6 digits."; return false; }
          try{ await Security.unlock(pin, record); }
          catch(e){
            errEl.textContent = "Incorrect PIN. Please try again.";
            modal.classList.add("shake");
            setTimeout(()=>modal.classList.remove("shake"), 450);
            if(pinCtrl) pinCtrl.clear();
            return false;
          }
          finish(pin);
        }}
      ],
      onMount: ({ modal })=>{
        pinCtrl = wirePinInputs("pin-prompt", ()=>{ const b = $(".modal-foot .btn.primary", modal); if(b) b.click(); });
        setTimeout(()=>{ const f = $("#pin-prompt .pin-cell"); if(f) f.focus(); }, 40);
      },
      onClose: ()=>{ finish(null); }
    });
  });
}

const SearchPanel = {
  isOpen: false, backdrop: null, results: [], activeIndex: 0,
  init(){
    const btn = $("#search-btn");
    if(btn) btn.addEventListener("click", ()=>this.toggle());
    document.addEventListener("keydown", (e)=>{
      const isK = (e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K");
      if(isK && Store.data){ e.preventDefault(); this.toggle(); }
    });
  },
  toggle(){ this.isOpen ? this.close() : this.open(); },
  open(){
    if(!Store.data || this.isOpen) return;
    this.isOpen = true;
    const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
    this.backdrop = document.createElement("div");
    this.backdrop.className = "search-backdrop";
    this.backdrop.innerHTML = `
      <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search">
        <div class="search-input-wrap">
          <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="search" id="search-input" placeholder="Search notes, contacts, meetings, events, shortcuts, apps, album, drive…" autocomplete="off" spellcheck="false">
          <span class="search-kbd">${isMac ? "⌘" : "Ctrl"}K</span>
        </div>
        <div class="search-results" id="search-results"></div>
        <div class="search-hint"><span><kbd>↑</kbd> <kbd>↓</kbd> Navigate</span><span><kbd>Enter</kbd> Open</span><span><kbd>Esc</kbd> Close</span></div>
      </div>`;
    document.body.appendChild(this.backdrop);
    const input = $("#search-input", this.backdrop);
    input.addEventListener("input", ()=>this.runQuery(input.value));
    input.addEventListener("keydown", (e)=>this.onKey(e));
    this.backdrop.addEventListener("mousedown", (e)=>{ if(e.target === this.backdrop) this.close(); });
    setTimeout(()=>input.focus(), 30);
    this.runQuery("");
  },
  close(){
    if(!this.isOpen) return;
    this.isOpen = false;
    if(this.backdrop) this.backdrop.remove();
    this.backdrop = null; this.results = []; this.activeIndex = 0;
  },
  runQuery(query){ const q = String(query||"").trim().toLowerCase(); this.results = q ? searchAll(q) : []; this.activeIndex = 0; this.render(); },
  flatItems(){ const items = []; this.results.forEach((g)=>g.items.forEach((it)=>items.push(it))); return items; },
  render(){
    const host = $("#search-results", this.backdrop); if(!host) return;
    if(!this.results.length){
      const empty = this.activeIndex === 0 && !$("#search-input", this.backdrop).value.trim() ? "Start typing to search your workspace." : "No matches found.";
      host.innerHTML = `<div class="search-empty">${esc(empty)}</div>`; return;
    }
    let idx = 0;
    const groups = this.results.map((g)=>`
      <div class="search-group">
        <div class="search-group-label">${esc(g.group)}</div>
        ${g.items.map((it)=>{
          const myIdx = idx++;
          const lockTag = it.locked ? `<span class="search-lock">${UI.icon("lock","ic-sm")} PIN</span>` : "";
          return `<button type="button" class="search-result${myIdx===this.activeIndex?" active":""}" data-idx="${myIdx}">
            <span class="s-icon">${UI.icon(it.icon||"search","ic-sm")}</span>
            <span class="s-main"><span class="s-title">${esc(it.title)} ${lockTag}</span>${it.sub ? `<span class="s-sub">${esc(it.sub)}</span>` : ""}</span>
          </button>`;
        }).join("")}
      </div>`).join("");
    host.innerHTML = groups;
    $$(".search-result", host).forEach((btn)=>{
      btn.addEventListener("click", ()=>this.activate(Number(btn.dataset.idx)));
      btn.addEventListener("mouseenter", ()=>{ this.activeIndex = Number(btn.dataset.idx); this.updateActive(); });
    });
  },
  updateActive(){ if(!this.backdrop) return; $$(".search-result", this.backdrop).forEach((el)=>{ el.classList.toggle("active", Number(el.dataset.idx) === this.activeIndex); }); },
  scrollActive(){ const el = $(`.search-result[data-idx="${this.activeIndex}"]`, this.backdrop); if(el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" }); },
  onKey(e){
    const flat = this.flatItems();
    if(e.key === "Escape"){ this.close(); return; }
    if(e.key === "ArrowDown"){ e.preventDefault(); if(!flat.length) return; this.activeIndex = Math.min(this.activeIndex + 1, flat.length - 1); this.updateActive(); this.scrollActive(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); if(!flat.length) return; this.activeIndex = Math.max(this.activeIndex - 1, 0); this.updateActive(); this.scrollActive(); }
    else if(e.key === "Enter"){ e.preventDefault(); this.activate(this.activeIndex); }
  },
  activate(i){
    const flat = this.flatItems();
    if(!flat[i]) return;
    const fn = flat[i].action;
    this.close();
    if(typeof fn === "function") setTimeout(()=>{ try{ fn(); }catch(e){ console.error("[WaceSpork] Search action failed:", e); } }, 40);
  }
};
function snippetAround(text, query){
  const s = String(text||"").replace(/\s+/g, " ");
  if(!s) return "";
  const idx = s.toLowerCase().indexOf(String(query||"").toLowerCase());
  if(idx < 0) return s.slice(0, 90);
  const start = Math.max(0, idx - 30);
  const end = Math.min(s.length, idx + String(query).length + 50);
  return (start > 0 ? "…" : "") + s.slice(start, end) + (end < s.length ? "…" : "");
}
function searchAll(q){
  const groups = [];
  const notes = Store.data.notes.filter((n)=>{
    return (n.name||"").toLowerCase().includes(q) || (n.content||"").toLowerCase().includes(q);
  }).slice(0, 6);
  if(notes.length) groups.push({ group: "Notepad", items: notes.map((n)=>({
    icon: "note", title: n.name, sub: snippetAround(n.content, q), locked: true,
    action: async ()=>{
      if(!NotesState.unlocked){
        const ok = await promptPinFor("Unlock Notepad", "Enter your PIN to open the note you selected.");
        if(!ok) return;
        NotesState.unlocked = true;
      }
      NotesState.openId = n.id; NotesState.autoOpened = true; NotesState.showTrash = false;
      Router.go("notes");
    } })) });
  const contacts = Store.data.contacts.filter((c)=>{
    const hay = [c.name, c.phone, c.email, ...(c.socials||[]).map((s)=>s.label+" "+s.value)].join(" ").toLowerCase();
    return hay.includes(q);
  }).slice(0, 6);
  if(contacts.length) groups.push({ group: "Contacts", items: contacts.map((c)=>({
    icon: "users", title: c.name, sub: [c.phone, c.email].filter(Boolean).join(" · "), action: ()=>Router.go("contacts") })) });
  const meetings = Store.data.meetings.filter((m)=>meetingSearchString(m).includes(q)).slice(0, 6);
  if(meetings.length) groups.push({ group: "Meetings", items: meetings.map((m)=>({
    icon: "video", title: m.topic, sub: `${fmtDateLong(m.date)}${m.time?" · "+fmtTimeDisplay(m.time):""}`, action: ()=>openMeetingModal(m) })) });
  const events = Store.data.schedule.filter((ev)=> [ev.title, ev.note, ev.date].join(" ").toLowerCase().includes(q)).slice(0, 6);
  if(events.length) groups.push({ group: "Schedule", items: events.map((ev)=>({
    icon: "calendar", title: ev.title, sub: `${fmtDateLong(ev.date)}${ev.start?" · "+fmtTimeDisplay(ev.start):""}`,
    action: ()=>{ if(ev.sourceMeetingId){ const m = meetingForEvent(ev); if(m) return openMeetingModal(m); } openEventModal(ev); } })) });
  const shortcuts = Store.data.shortcuts.filter((s)=> [s.name, s.url, s.description].join(" ").toLowerCase().includes(q)).slice(0, 6);
  if(shortcuts.length) groups.push({ group: "Shortcuts", items: shortcuts.map((s)=>({
    icon: "link", title: s.name, sub: domainOf(s.url), action: ()=>openExternal(s.url) })) });
  const apps = Store.data.apps.filter((a)=> [a.name, a.url, a.type].join(" ").toLowerCase().includes(q)).slice(0, 6);
  if(apps.length) groups.push({ group: "Apps", items: apps.map((a)=>({
    icon: a.type === "html" ? "code" : "grid", title: a.name,
    sub: a.type === "html" ? `Embedded HTML · ${formatBytes(a.htmlSize||0)}` : domainOf(a.url),
    action: ()=>{ if(a.type === "html") HTMLAppPanel.open(a); else openExternal(a.url); } })) });
  const appFileMatches = [];
  Object.keys(Store.data.appStorage || {}).forEach((appId)=>{
    const b = Store.data.appStorage[appId];
    if(!b || !b.files) return;
    const app = Store.data.apps.find((a)=>a.id===appId);
    const appName = (app && app.name) || "Unknown app";
    Object.keys(b.files).forEach((path)=>{
      const f = b.files[path]; if(!f) return;
      const hay = [path, f.mime||"", appName];
      if(f.encoding === "utf8") hay.push(String(f.content||"").slice(0, 4000));
      if(hay.join(" ").toLowerCase().includes(q)){
        appFileMatches.push({ appId, appName, path, file: f });
      }
    });
  });
  if(appFileMatches.length){
    groups.push({ group: "App files", items: appFileMatches.slice(0, 6).map((it)=>({
      icon: "folder",
      title: it.path,
      sub: `${it.appName} · ${formatBytes(it.file.size||0)} · ${it.file.mime||""}`,
      action: ()=>{ UI.closeModal(); setTimeout(()=>openSingleAppFiles(it.appId), 40); }
    })) });
  }
  const album = (Store.data.album||[]).filter((it)=> (it.name||"").toLowerCase().includes(q)).slice(0, 6);
  if(album.length) groups.push({ group: "Personal Album", items: album.map((it)=>({
    icon: "image", title: it.name, sub: `${formatBytes(it.size||0)} · ${fmtDateTime(it.addedAt)}`, locked: true,
    action: async ()=>{
      if(!AlbumState.unlocked){
        const ok = await promptPinFor("Unlock Personal Album", "Enter your PIN to open the image you selected.");
        if(!ok) return;
        AlbumState.unlocked = true;
      }
      Router.go("album");
      setTimeout(()=>openAlbumViewer(it.id), 160);
    } })) });
  const driveMatches = [];
  Object.keys(Store.data.personalDrive.files || {}).forEach((p)=>{
    const f = Store.data.personalDrive.files[p]; if(!f) return;
    const hay = [p, f.mime||""];
    if(f.encoding === "utf8") hay.push(String(f.content||"").slice(0, 4000));
    if(hay.join(" ").toLowerCase().includes(q)){
      driveMatches.push({ path: p, file: f });
    }
  });
  if(driveMatches.length) groups.push({ group: "Personal Drive", items: driveMatches.slice(0, 6).map((it)=>({
    icon: "file",
    title: it.path,
    sub: `${formatBytes(it.file.size||0)} · ${it.file.mime||""}`,
    locked: true,
    action: async ()=>{
      if(!DriveState.unlocked){
        const ok = await promptPinFor("Unlock Personal Drive", "Enter your PIN to open the file you selected.");
        if(!ok) return;
        DriveState.unlocked = true;
      }
      const parent = it.path.includes("/") ? it.path.slice(0, it.path.lastIndexOf("/")) : "";
      DriveState.cwd = parent;
      Router.go("drive");
      setTimeout(()=>openDrivePreview(it.path), 160);
    }
  })) });
  return groups;
}

function ensureHtmlShell(html, title, headSnippet){
  let s = String(html||"");
  const isFullDoc = /<html[\s>]/i.test(s);
  if(!isFullDoc){
    return `<!doctype html><html><head><meta charset="utf-8">` +
      `<meta name="viewport" content="width=device-width,initial-scale=1">` +
      `<title>${esc(title||"Imported HTML")}</title>` +
      (headSnippet || "") +
      `<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;` +
      `padding:16px;margin:0;color:#101828;background:#fff;line-height:1.5}` +
      `img{max-width:100%;height:auto}</style></head><body>${s}</body></html>`;
  }
  if(headSnippet){
    if(/<head[^>]*>/i.test(s)){
      s = s.replace(/<head[^>]*>/i, (m)=> m + headSnippet);
    } else if(/<html[^>]*>/i.test(s)){
      s = s.replace(/<html[^>]*>/i, (m)=> m + "<head>" + headSnippet + "</head>");
    } else {
      s = headSnippet + s;
    }
  }
  return s;
}

async function importHtmlApp(){
  if(demoBlock("apps", "apps", Store.data.apps.length)) return;
  const files = await pickFile("text/html,.html,.htm,application/xhtml+xml");
  if(!files.length) return;
  const file = files[0];
  const looksHtml = /\.html?$/i.test(file.name) || file.type === "text/html" || file.type === "application/xhtml+xml";
  if(!looksHtml){ UI.toast("Please choose an .html file.","error"); return; }
  let text = "";
  try{ text = await readFileAsText(file); }
  catch(e){ UI.toast("Could not read that file.","error"); return; }
  const bytes = utf8Bytes(text);
  if(bytes > HTML_APP_WARN_BYTES){
    const ok = await UI.confirm({
      title: "Large HTML file",
      message: `This file is ${formatBytes(bytes)}, which is above ${formatBytes(HTML_APP_WARN_BYTES)}. It will use a noticeable share of your 5 MB storage budget. Continue?`,
      confirmLabel: "Import anyway"
    });
    if(!ok) return;
  }
  const name = (file.name || "Imported HTML").replace(/\.html?$/i, "") || "Imported HTML";
  const app = { id: uid(), type: "html", name, url: "", htmlContent: text, htmlSize: bytes, color: null, icon: null };
  try{
    Store.data.apps.push(app);
    if(!Store.data.appStorage) Store.data.appStorage = {};
    Store.save();
    if(Router.current === "apps") refresh(); else renderSidebar();
    UI.toast(`Imported ${file.name} (${formatBytes(bytes)}).`, "success");
  }catch(err){
    UI.toast("Could not store the imported file.","error");
  }
}

function renderClockBody(w){
  const now = new Date();
  const time = fmtClock(now);
  const date = now.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
  const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Local";
  let second = "";
  if(w.config.showSecondTz && w.config.secondTz){

    second = `<div class="clock-secondary"><div class="clock-time">${fmtClock(t2)}</div><div class="clock-tz">${esc(w.config.secondTz)}</div></div>`;

  return `<div class="clock-wrap"><div class="clock-time" data-clock-time>${time}</div><div class="clock-date">${esc(date)}</div><div class="clock-tz">${esc(localTz)}</div>${second}</div>`;

function parseTzOffset(tzStr){
  const m = /^UTC([+-])(\d{1,2})(?::(\d{2}))?$/.exec(tzStr);
  if(!m) return 0;
  const sign = m[1]==="-" ? -1 : 1;
  const h = Number(m[2]); const min = Number(m[3]||0);
  return sign * (h*60 + min);
}

let clockTimer = null;
function startClockTicker(){
  stopClockTicker();
  clockTimer = setInterval(()=>{
    const nodes = $$("[data-clock-time]");
    if(!nodes.length){ stopClockTicker(); return; }
    const now = new Date(); const t = fmtClock(now);
    nodes.forEach((n)=>{ n.textContent = t; });
    const widgets = Store.data.home.widgets.filter((w)=>w.type==="clock" && w.config.showSecondTz && w.config.secondTz);
    widgets.forEach((w)=>{
      const body = $(`[data-widget-body="${w.id}"]`); if(!body) return;
      const secEl = $(".clock-secondary .clock-time", body);
      if(secEl){
        const offset = parseTzOffset(w.config.secondTz);
        const t2 = new Date(now.getTime() + (offset*60*1000) + now.getTimezoneOffset()*60000);
        secEl.textContent = fmtClock(t2);
      }
    });
  }, 1000);
}
function stopClockTicker(){ if(clockTimer){ clearInterval(clockTimer); clockTimer = null; } }

function wireWidgetReorder(){
  const grid = $("#home-grid"); if(!grid) return;
  let draggingId = null;
  grid.addEventListener("dragstart", (e)=>{
    const widget = e.target.closest(".widget"); if(!widget) return;
    draggingId = widget.dataset.widgetId;
    widget.classList.add("dragging");
    try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", draggingId); }catch(err){}
  });
  grid.addEventListener("dragend", ()=>{ $$(".widget.dragging").forEach((el)=>el.classList.remove("dragging")); draggingId = null; Store.save(); });
  grid.addEventListener("dragover", (e)=>{
    if(!draggingId) return;
    e.preventDefault();
    const target = e.target.closest(".widget"); if(!target) return;
    if(target.dataset.widgetId === draggingId) return;
    const fromIdx = Store.data.home.widgets.findIndex((x)=>x.id===draggingId);
    const toIdx = Store.data.home.widgets.findIndex((x)=>x.id===target.dataset.widgetId);
    if(fromIdx<0 || toIdx<0 || fromIdx===toIdx) return;
    const [moved] = Store.data.home.widgets.splice(fromIdx, 1);
    Store.data.home.widgets.splice(toIdx, 0, moved);
    const dragged = grid.querySelector(`[data-widget-id="${draggingId}"]`);
    if(dragged){ if(toIdx > fromIdx) target.parentNode.insertBefore(dragged, target.nextSibling); else target.parentNode.insertBefore(dragged, target); }
  });
  grid.addEventListener("drop", (e)=>{ e.preventDefault(); });
}

const ScheduleState = { year: new Date().getFullYear(), month: new Date().getMonth() };
function monthMatrix(year, month){
  const first = new Date(year, month, 1); const startOffset = first.getDay();
  const start = new Date(year, month, 1 - startOffset); const cells = [];
  for(let i=0;i<42;i++){ const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i); cells.push({ date: d, iso: isoDate(d), inMonth: d.getMonth() === month }); }
  return cells;
}
function eventsOn(iso){ return Store.data.schedule.filter((e)=>e.date===iso).sort((a,b)=>(a.start||"").localeCompare(b.start||"")); }
function countStandaloneEvents(){
  return Store.data.schedule.filter((ev)=> !ev.sourceMeetingId).length;
}

const NotesState = { openId: null, autoOpened: false, query: "", showTrash: false, unlocked: false };
function noteExt(name){ const m = /\.([a-z0-9]+)$/i.exec(name||""); return m ? m[1] : "txt"; }
function noteBase(name){ return (name||"Untitled").replace(/\.[a-z0-9]+$/i, ""); }
function visibleNoteIds(){
  const notes = Store.data.notes.slice().sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
  const q = NotesState.query.trim().toLowerCase();
  const visible = q ? notes.filter((n)=>{ return n.name.toLowerCase().includes(q) || (n.content||"").toLowerCase().includes(q); }) : notes;
  return visible.map((n)=>n.id);
}
function notesListHtml(){
  const notes = Store.data.notes.slice().sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));

function notesTrashListHtml(){

function uniqueNoteName(base, ext){
  const names = new Set(Store.data.notes.map((n)=>n.name.toLowerCase()));
  let candidate = `${base}.${ext}`; let i = 2;
  while(names.has(candidate.toLowerCase())) candidate = `${base} ${i++}.${ext}`;
  return candidate;
}

registerActions({

function downloadAppFile(appId, path){
  const b = Store.data.appStorage[appId]; if(!b || !b.files || !b.files[path]) return;
  const f = b.files[path];
  let blob;
  if(f.encoding === "base64"){
    try{
      const bin = atob(f.content);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      blob = new Blob([bytes], { type: f.mime || "application/octet-stream" });
    }catch(e){ UI.toast("Could not decode the file.","error"); return; }
  } else {
    blob = new Blob([f.content||""], { type: f.mime || "text/plain" });
  }
  downloadBlob(f.name || path, blob);
  UI.toast(`Downloaded ${f.name || path}`, "success");
}

const AlbumState = { unlocked: false };
async function compressImageToJpeg(sourceDataUrl){
  const img = await loadImage(sourceDataUrl);
  let w = img.naturalWidth || img.width;
  let h = img.naturalHeight || img.height;
  if(!w || !h) throw new Error("Could not read image dimensions.");
  const scale = Math.min(1, ALBUM_MAX_DIM / Math.max(w, h));
  w = Math.max(1, Math.round(w * scale));
  h = Math.max(1, Math.round(h * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return canvas.toDataURL("image/jpeg", ALBUM_JPEG_QUALITY);
}
function albumTotalBytes(){
  return (Store.data.album||[]).reduce((sum, it)=> sum + (Number(it.size)||0), 0);
}
function albumItemBlob(item){
  const m = /^data:([^;]+);base64,(.*)$/.exec(item.dataUrl || "");
  if(!m) return null;
  try{
    const bin = atob(m[2]);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: m[1] || "image/jpeg" });
  }catch(e){ return null; }
}
function downloadAlbumItem(item){
  try{
    const blob = albumItemBlob(item);
    if(!blob) throw new Error("invalid");
    downloadBlob(item.name || "image.jpg", blob);
  }catch(e){ UI.toast("Could not download the image.","error"); }
}
async function addAlbumImageFromDataUrl(dataUrl, name, source){
  if(DEMO_MODE && (Store.data.album||[]).length >= DEMO_LIMITS.albumFiles){
    openDemoUpsell("Personal Album images", DEMO_LIMITS.albumFiles);
    return null;
  }
  let compressed;
  try{ compressed = await compressImageToJpeg(dataUrl); }
  catch(e){ UI.toast("Could not process that image.","error"); return null; }
  const size = base64DataUrlBytes(compressed);
  if(!Array.isArray(Store.data.album)) Store.data.album = [];
  let cleanName = String(name || "image.jpg").replace(/[\\\/]+/g, "_").slice(0, 120) || "image.jpg";
  if(!/\.jpe?g$/i.test(cleanName)) cleanName = cleanName.replace(/\.[a-z0-9]+$/i, "") + ".jpg";
  const item = { id: uid(), name: cleanName, dataUrl: compressed, size, addedAt: nowISO(), source: source || "paste" };
  Store.data.album.push(item);
  Store.save();
  if(Router.current === "album") refresh(); else renderSidebar();
  UI.toast(`Added ${item.name} (${formatBytes(size)}).`, "success");
  return item;
}
async function addAlbumImageFromFile(file){
  if(DEMO_MODE && (Store.data.album||[]).length >= DEMO_LIMITS.albumFiles){
    openDemoUpsell("Personal Album images", DEMO_LIMITS.albumFiles);
    return null;
  }
  const dataUrl = await readFileAsDataUrl(file);
  const base = (file.name || "image").replace(/\.[a-z0-9]+$/i, "");
  return addAlbumImageFromDataUrl(dataUrl, base + ".jpg", "file");
}
async function fetchImageAsDataUrl(url){
  let resp;
  try{ resp = await fetch(url, { mode: "cors", credentials: "omit" }); }
  catch(e){ throw new Error("Could not download the image. The server may not allow cross-origin requests."); }
  if(!resp.ok) throw new Error("Server returned HTTP " + resp.status + ".");
  const blob = await resp.blob();
  if(!blob.type || blob.type.indexOf("image/") !== 0) throw new Error("That URL did not return an image.");
  return await new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error("Could not read the downloaded image."));
    r.readAsDataURL(blob);
  });
}
function guessImageNameFromUrl(url){
  try{
    const u = new URL(url);
    const parts = u.pathname.split("/").filter(Boolean);
    const last = parts[parts.length - 1] || "image";
    const base = last.replace(/\.[a-z0-9]+$/i, "").replace(/[^a-z0-9\-_ ]/gi, "").trim() || "image";
    return base + ".jpg";
  }catch(e){ return "image.jpg"; }
}
function handleAlbumPasteEvent(e){
  if(Router.current !== "album" || !AlbumState.unlocked) return;
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  const files = [];
  for(let i=0;i<items.length;i++){
    const it = items[i];
    if(it.kind === "file" && it.type && it.type.indexOf("image/") === 0){
      const f = it.getAsFile();
      if(f) files.push(f);
    }
  }
  if(!files.length) return;
  e.preventDefault();
  files.forEach((f)=>{ addAlbumImageFromFile(f).catch((err)=>{ UI.toast("Could not add the pasted image.","error"); }); });
}

const DriveState = { unlocked: false, cwd: "", view: "list", query: "" };

function driveRoot(){ return Store.data.personalDrive; }
function driveFolders(){ return Store.data.personalDrive.folders; }
function driveFiles(){ return Store.data.personalDrive.files; }
function drivePathJoin(dir, name){ return dir ? `${dir}/${name}` : String(name); }
function driveBaseName(path){ const i = String(path).lastIndexOf("/"); return i >= 0 ? path.slice(i+1) : path; }
function driveDirOf(path){ const i = String(path).lastIndexOf("/"); return i >= 0 ? path.slice(0, i) : ""; }
function driveTotalBytes(){
  return Object.keys(driveFiles()).reduce((s,k)=> s + (Number(driveFiles()[k].size)||0), 0);
}
function driveFileCount(){ return Object.keys(driveFiles()).length; }
function driveListFolders(cwd){
  const prefix = cwd ? cwd + "/" : "";
  const seen = new Set();
  driveFolders().forEach((f)=>{
    if(!f.startsWith(prefix) || f === cwd) return;
    const rest = f.slice(prefix.length);
    if(!rest) return;
    const seg = rest.split("/")[0];
    if(seg) seen.add(seg);
  });
  Object.keys(driveFiles()).forEach((p)=>{
    if(!p.startsWith(prefix) || p === cwd) return;
    const rest = p.slice(prefix.length);
    if(!rest) return;
    const seg = rest.split("/")[0];
    if(rest.includes("/") && seg) seen.add(seg);
  });
  return Array.from(seen).sort((a,b)=> a.localeCompare(b));
}
function driveListFiles(cwd){
  const prefix = cwd ? cwd + "/" : "";
  return Object.keys(driveFiles()).filter((p)=>{
    if(!p.startsWith(prefix)) return false;
    const rest = p.slice(prefix.length);
    return rest && !rest.includes("/");
  }).sort((a,b)=> driveBaseName(a).localeCompare(driveBaseName(b)));
}
function driveChildrenOf(cwd){
  const folders = driveListFolders(cwd).map((n)=> drivePathJoin(cwd, n));
  const files = driveListFiles(cwd);
  return { folders, files };
}
function driveEnsureFolder(path){
  const p = String(path||"").replace(/^\/+/,"").replace(/\/+$/,"");
  if(!p) return;
  if(!driveFolders().includes(p)) driveFolders().push(p);
}
function driveFileToBlob(file){
  if(file.encoding === "base64"){
    const bin = atob(file.content || "");
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: file.mime || "application/octet-stream" });
  }
  return new Blob([file.content || ""], { type: file.mime || "text/plain" });
}
function driveFileToDataUrl(file){
  if(file.encoding === "base64") return `data:${file.mime||"application/octet-stream"};base64,${file.content||""}`;
  return null;
}
function driveFreeBytes(){ return Math.max(0, STORAGE_LIMIT_BYTES - estimateBackupBytes()); }
function driveSizeFor(raw, encoding){ return Math.round(raw * (encoding === "base64" ? 1.78 : 1.34)); }

function driveWriteFile(path, { content, encoding, mime, size }){
  const root = driveRoot();
  const existing = root.files[path];
  const rawSize = typeof size === "number" ? size : (encoding === "base64" ? fsBase64Bytes(content) : utf8Bytes(content));
  if(rawSize > DRIVE_FILE_MAX_BYTES){
    throw new Error(`File is too large: ${formatBytes(rawSize)} exceeds the ${formatBytes(DRIVE_FILE_MAX_BYTES)} per-file cap.`);
  }
  const oldRaw = existing ? Number(existing.size) || 0 : 0;
  const oldEncoding = existing ? existing.encoding : encoding;
  const delta = driveSizeFor(rawSize, encoding) - driveSizeFor(oldRaw, oldEncoding);
  const projected = estimateBackupBytes() + delta;
  if(projected > STORAGE_LIMIT_BYTES){
    throw new Error(`Not enough workspace storage. This file would push estimated usage to ${formatBytes(projected)} of the ${formatBytes(STORAGE_LIMIT_BYTES)} budget.`);
  }
  const now = nowISO();
  root.files[path] = {
    name: path,
    mime: mime || guessMime(path),
    size: rawSize,
    encoding,
    content,
    createdAt: existing ? existing.createdAt : now,
    modifiedAt: now
  };
  return root.files[path];
}
function driveDeleteFile(path){
  const root = driveRoot();
  if(!(path in root.files)) return false;
  delete root.files[path];
  return true;
}
function driveDeleteFolder(path){
  const root = driveRoot();
  const prefix = path + "/";
  let removed = 0;
  Object.keys(root.files).forEach((k)=>{
    if(k === path || k.startsWith(prefix)){ delete root.files[k]; removed++; }
  });
  root.folders = root.folders.filter((f)=> f !== path && !f.startsWith(prefix));
  return removed;
}
function driveRenameFile(oldPath, newPath){
  const root = driveRoot();
  if(!(oldPath in root.files)) return false;
  if(oldPath === newPath) return true;
  const f = root.files[oldPath];
  if(newPath in root.files) throw new Error("A file with that name already exists here.");
  delete root.files[oldPath];
  f.name = newPath; f.modifiedAt = nowISO();
  root.files[newPath] = f;
  return true;
}
function driveRenameFolder(oldPath, newPath){
  const root = driveRoot();
  if(oldPath === newPath) return true;
  const oldPrefix = oldPath + "/";
  const newPrefix = newPath + "/";
  if(root.folders.includes(newPath)) throw new Error("A folder with that name already exists here.");
  Object.keys(root.files).forEach((k)=>{
    if(!k.startsWith(oldPrefix)) return;
    const rest = k.slice(oldPrefix.length);
    const next = newPrefix + rest;
    const f = root.files[k]; delete root.files[k];
    f.name = next; f.modifiedAt = nowISO();
    root.files[next] = f;
  });
  root.folders = root.folders.map((f)=>{
    if(f === oldPath) return newPath;
    if(f.startsWith(oldPrefix)) return newPrefix + f.slice(oldPrefix.length);
    return f;
  });
  return true;
}
function driveEnsureUniqueName(dir, name){
  const candidate = drivePathJoin(dir, name);
  const root = driveRoot();
  if(!(candidate in root.files) && !root.folders.includes(candidate)) return name;
  const m = /^(.*?)(\.[a-z0-9]+)?$/i.exec(name);
  const base = m && m[1] ? m[1] : name;
  const ext = m && m[2] ? m[2] : "";
  let i = 2;
  while(true){
    const next = `${base} ${i}${ext}`;
    const nextPath = drivePathJoin(dir, next);
    if(!(nextPath in root.files) && !root.folders.includes(nextPath)) return next;
    i++;
  }
}
async function driveImportFile(file, targetDir, source){
  const ext = extOf(file.name);
  const isText = isTextExt(ext) && !isImageExt(ext);
  let content, encoding, mime, size;
  mime = file.type || guessMime(file.name);
  if(isText){
    const text = await readFileAsText(file);
    content = text;
    encoding = "utf8";
    size = utf8Bytes(text);
  } else {
    const dataUrl = await readFileAsDataUrl(file);
    const m = /^data:[^;]+;base64,(.*)$/.exec(dataUrl);
    content = m ? m[1] : "";
    encoding = "base64";
    size = fsBase64Bytes(content);
  }
  const name = driveEnsureUniqueName(targetDir, file.name || "file");
  const path = drivePathJoin(targetDir, name);
  driveWriteFile(path, { content, encoding, mime, size });
  return { path, name, size };
}
async function driveImportFileWithSuggestion(file, targetDir){

        const dir = driveDirOf(path);
        const next = drivePathJoin(dir, name);
        try{
          if(isFolder) driveRenameFolder(path, next);
          else driveRenameFile(path, next);
          Store.save(); refresh();
          UI.toast("Renamed.", "success");
        }catch(e){ UI.toast(e.message || "Could not rename.", "error"); return false; }

function driveMoveSelectedPrompt(){
  const ids = Array.from(SelectState.selected.drive);
  if(!ids.length) return;
  const allFolders = [""].concat(driveFolders().slice().sort());
  const isDescendant = (child, parent)=>{ if(!parent) return true; return child === parent || child.startsWith(parent + "/"); };
  const blocked = new Set(ids.filter((p)=> driveFolders().includes(p)));
  const targets = allFolders.filter((t)=> !Array.from(blocked).some((b)=> isDescendant(t, b)));
  UI.openModal({
    title: "Move Selected",
    body: `<div class="field"><label class="label" for="dm-target">Destination folder</label>
        <select class="input" id="dm-target">
          ${targets.map((t)=>`<option value="${escapeAttr(t)}">${esc(t || "Home")}</option>`).join("")}
        </select></div>
      <span class="tiny">${ids.length} item${ids.length===1?"":"s"} selected. Files and folders keep their names; conflicts get a numbered suffix.</span>`,
    actions: [
      { label:"Cancel", variant:"ghost" },
      { label:"Move", variant:"primary", onClick: ({ modal })=>{
        const target = $("#dm-target", modal).value || "";
        const root = driveRoot();
        let moved = 0;
        ids.forEach((p)=>{
          if(root.folders.includes(p)) return;
          if(!(p in root.files)) return;
          const base = driveBaseName(p);
          const name = driveEnsureUniqueName(target, base);
          const next = drivePathJoin(target, name);
          const f = root.files[p]; delete root.files[p];
          f.name = next; f.modifiedAt = nowISO();
          root.files[next] = f;
          moved++;
        });
        ids.forEach((p)=>{
          if(!root.folders.includes(p)) return;
          const base = driveBaseName(p);
          let name = base;
          const seen = new Set([].concat(root.folders, Object.keys(root.files)));
          let i = 2;
          while(seen.has(drivePathJoin(target, name))){ name = `${base} ${i++}`; }
          const next = drivePathJoin(target, name);
          try{ driveRenameFolder(p, next); moved++; }
          catch(e){ console.warn("[WaceSpork] drive folder move failed:", e); }
        });
        Store.save(); refresh();
        UI.toast(`Moved ${moved} item${moved===1?"":"s"}.`, "success");
      }}
    ]
  });
}

async function decryptEncryptedBackupToWorkspace(envelope, password){
  const payload = await Security.decryptBackup(password, envelope);
  if(payload.format === "wacespork-backup"){ Store.validateBackup(payload); return payload.workspace; }
  if(payload.format === "wacespork-raw-envelope"){
    const pin = await promptForOriginalPin();
    if(!pin) return null;
    let key;
    try{ key = await Security.unlock(pin, payload.securityRecord); }
    catch(e){ throw new Error("Incorrect PIN for the original workspace."); }
    const ws = await Security.decryptJSON(key, payload.envelope);
    if(!ws) throw new Error("The backup did not contain recoverable workspace data.");
    return ws;
  }
  throw new Error("Unknown backup format inside the file.");
}

function pinInputHtml(idPrefix, label){
  let cells = "";
  for(let i=0;i<6;i++){ cells += `<input class="pin-cell" type="password" inputmode="numeric" autocomplete="off" maxlength="1" data-pin-index="${i}" data-pin-group="${idPrefix}" aria-label="${escapeAttr(label)} digit ${i+1}">`; }
  return `<div class="pin-row" id="${idPrefix}" role="group" aria-label="${escapeAttr(label)}">${cells}</div>`;
}
function wirePinInputs(prefix, onComplete){
  const group = document.getElementById(prefix); if(!group) return null;
  const cells = $$(".pin-cell", group);
  const value = () => cells.map((c)=>c.value).join("");
  const update = () => cells.forEach((c)=>c.classList.toggle("filled", !!c.value));
  cells.forEach((cell, index)=>{
    cell.addEventListener("input", ()=>{
      cell.value = cell.value.replace(/\D/g, "").slice(0, 1); update();
      if(cell.value && index < cells.length - 1) cells[index+1].focus();
      if(value().length === 6) onComplete(value());
    });
    cell.addEventListener("keydown", (e)=>{
      if(e.key === "Backspace" && !cell.value && index > 0){ cells[index-1].focus(); cells[index-1].value = ""; update(); e.preventDefault(); }
      if(e.key === "ArrowLeft" && index > 0){ cells[index-1].focus(); e.preventDefault(); }
      if(e.key === "ArrowRight" && index < cells.length - 1){ cells[index+1].focus(); e.preventDefault(); }
    });
    cell.addEventListener("paste", (e)=>{
      const text = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "").slice(0, 6);
      if(!text) return;
      e.preventDefault();
      text.split("").forEach((ch, i)=>{ if(cells[i]) cells[i].value = ch; });
      update();
      const next = Math.min(text.length, cells.length - 1);
      cells[next].focus();
      if(text.length === 6) onComplete(text);
    });
  });
  update();
  return { value, clear(){ cells.forEach((c)=>{ c.value=""; }); update(); cells[0].focus(); }, focus(){ cells[0].focus(); }, group };
}

        SetupState.name = (workspace.profile && workspace.profile.name) || SetupState.name || "Me";
        SetupState.avatar = (workspace.profile && workspace.profile.avatar) || null;
        SetupState.theme = (workspace.settings && workspace.settings.theme) || SetupState.theme || "light";
        UI.toast("Backup decrypted. Now choose a new PIN for this browser.","success");
        SetupState.step = 2; renderSetup();
      }}
    ]
  });
}
let lockPinController = null;
function showLock(){
  $("#setup").classList.add("hidden"); $("#shell").classList.add("hidden");
  const host = $("#lock"); host.classList.remove("hidden");
  const prefs = Store.prefs();
  const name = (Store.data && Store.data.profile.name) || prefs.lastName || "Welcome back";
  const avatar = (Store.data && Store.data.profile.avatar) || prefs.lastAvatar || null;
  host.innerHTML = `
    <div class="setup-card" style="max-width:430px">
      <div style="text-align:center;margin-bottom:24px">
        <span class="avatar" style="width:70px;height:70px;font-size:1.5rem;margin:0 auto 14px;${avatar ? "" : `background:hsl(${hueFor(name)} 62% 48%)`}">
          ${avatar?`<img src="${escapeAttr(avatar)}" alt="">`:esc(initials(name))}</span>
        <div class="lock-name">${esc(name)}</div>
        <div class="lock-sub">Enter your 6-digit PIN to unlock WaceSpork${DEMO_MODE ? " (Demo)" : ""}</div>
      </div>
      ${pinInputHtml("lock-pin","PIN")}
      <div class="pin-error" id="lock-error"></div>
      <div style="display:flex;justify-content:center;margin-top:18px">
        <button class="btn primary" id="lock-unlock" type="button" style="min-width:180px">Unlock</button>
      </div>
      <div style="text-align:center;margin-top:26px;display:flex;flex-direction:column;gap:8px;align-items:center">
        <button class="btn ghost sm" id="lock-reset" type="button">Forgot your PIN? Reset workspace</button>
        <span class="tiny" style="max-width:330px">Resetting erases this browser's workspace data. It never requires your PIN.</span>
      </div>
    </div>`;
  const doUnlock = async (pin)=>{
    const errEl = $("#lock-error"); const card = $(".setup-card", host);
    errEl.textContent = "";
    if(!/^\d{6}$/.test(pin)){ errEl.textContent = "Please enter all 6 digits."; return; }
    try{
      await Store.unlock(pin);
      lockPinController = null;
      enterWorkspace();
    }catch(e){
      errEl.textContent = e.message === "Incorrect PIN" ? "Incorrect PIN. Please try again." : (e.message || "Could not unlock.");
      if(card){ card.classList.add("shake"); setTimeout(()=>card.classList.remove("shake"), 450); }
      if(lockPinController) lockPinController.clear();
    }
  };
  lockPinController = wirePinInputs("lock-pin", (pin)=>doUnlock(pin));
  $("#lock-unlock").addEventListener("click", ()=>doUnlock(lockPinController.value()));
  $("#lock-reset").addEventListener("click", ()=>openResetFlow());
  setTimeout(()=>{ if(lockPinController) lockPinController.focus(); }, 60);
}
function enterWorkspace(){
  $("#setup").classList.add("hidden"); $("#lock").classList.add("hidden"); $("#shell").classList.remove("hidden");
  Theme.apply(Store.data.settings.theme || "light");
  IdleLock.init(Store.data.settings.autoLockMinutes);
  snapshotProfileToPrefs();
  Router.init();
  renderView();
  UI.markSaved(new Date());
  setTimeout(checkStorageWarning, 400);
}
function lockWorkspace(reason){
  if(!Store.data) return;
  snapshotProfileToPrefs(); stopClockTicker(); SearchPanel.close();
  try{ HTMLAppPanel.close(); }catch(e){}
  AlbumState.unlocked = false;
  NotesState.unlocked = false;
  DriveState.unlocked = false;
  sidebarArrangeMode = false;
  Object.keys(SelectState.active).forEach((k)=>{ SelectState.active[k] = false; SelectState.selected[k].clear(); });
  IdleLock.stop(); Store.lock(); showLock();
  if(reason === "auto"){ setTimeout(()=>UI.toast("Workspace locked after inactivity.","info"), 120); }
}
function openResetFlow(){
  const state = { confirmText: "", error: "" };
  UI.closeModal();
  const backdrop = document.createElement("div"); backdrop.className = "modal-backdrop";
  const modal = document.createElement("div"); modal.className = "modal";
  modal.setAttribute("role","dialog"); modal.setAttribute("aria-modal","true"); modal.setAttribute("aria-labelledby","modal-title");
  backdrop.appendChild(modal);
  const closeResetModal = ()=>{ backdrop.remove(); document.removeEventListener("keydown", escapeHandler); };
  const escapeHandler = (e)=>{ if(e.key !== "Escape") return;
    const top = document.querySelector("#modal-root .modal-backdrop:last-of-type");
    if(top === backdrop) closeResetModal(); };
  document.addEventListener("keydown", escapeHandler);
  backdrop.addEventListener("mousedown", (e)=>{ if(e.target === backdrop) closeResetModal(); });
  const render = ()=>{
    const canReset = state.confirmText === "Reset My Workspace";
    modal.innerHTML = `
      <div class="modal-head"><h2 id="modal-title">Reset Workspace</h2>
        <button type="button" class="icon-btn" data-modal-close aria-label="Close dialog">${UI.icon("x")}</button></div>
      <div class="modal-body">
        <div class="warn-box" style="margin-bottom:18px">${UI.icon("alert")}
          <span>This will permanently remove the current workspace data from this browser — notes, contacts, meetings, events, shortcuts, apps, app files, Personal Drive files, your profile, your Home layout and your PIN. Personal Album images are also erased.</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-wrap:wrap">
          <div><div style="font-weight:600;font-size:.88rem">Export an encrypted backup first</div>
            <div class="tiny">Strongly recommended — this is the only way to bring your data back. The file is protected by a recovery password you choose.</div></div>
          <button class="btn primary" id="reset-export" type="button">${UI.icon("shield","ic-sm")} Export My Encrypted Backup</button>
        </div>
        <div class="field" style="margin-top:20px">
          <label class="label" for="reset-confirm">Type “Reset My Workspace” to continue</label>
          <input class="input" id="reset-confirm" autocomplete="off" placeholder="Reset My Workspace" value="${escapeAttr(state.confirmText)}" aria-describedby="reset-error">
          <div id="reset-error" class="tiny" style="color:var(--danger);min-height:18px">${esc(state.error)}</div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" data-modal-close type="button">Cancel</button>
        <button class="btn danger" id="reset-do" type="button" ${canReset ? "" : "disabled"}>Reset Workspace</button>
      </div>`;
    const input = $("#reset-confirm", modal);
    input.addEventListener("input", ()=>{ state.confirmText = input.value;
      const btn = $("#reset-do", modal); if(btn) btn.disabled = state.confirmText !== "Reset My Workspace"; });
    input.addEventListener("keydown", (e)=>{ if(e.key === "Enter"){ e.preventDefault(); const b = $("#reset-do", modal); if(b && !b.disabled) b.click(); } });
    $$("[data-modal-close]", modal).forEach((b)=>b.addEventListener("click", closeResetModal));
    $("#reset-export", modal).addEventListener("click", ()=>openEncryptedExportModal());
    $("#reset-do", modal).addEventListener("click", ()=>{
      if(state.confirmText !== "Reset My Workspace"){ state.error = "Please type the phrase exactly as shown."; render(); return; }
      Store.resetAll(); IdleLock.stop(); closeResetModal();
      UI.toast("Workspace reset. Starting fresh.","success");
      Theme.apply("light"); showSetup();
    });
    setTimeout(()=>{ const t = $("#reset-confirm", modal); if(t) t.focus(); }, 40);
  };
  $("#modal-root").appendChild(backdrop);
  render();
}

/* [X] BOOT */
function bindGlobalControls(){
  $("#lock-btn").addEventListener("click", ()=>lockWorkspace("manual"));
  $("#theme-toggle").addEventListener("click", ()=>{ Theme.toggle(); if(Router.current === "settings") refresh(); });
  $("#profile-chip").addEventListener("click", ()=>{ Router.go("settings"); });
  $("#menu-btn").addEventListener("click", ()=>{
    const sidebar = $("#sidebar"), scrim = $("#sidebar-scrim");
    const open = sidebar.classList.toggle("open");
    scrim.classList.toggle("show", open);
    $("#menu-btn").setAttribute("aria-expanded", open ? "true" : "false");
  });
  $("#sidebar-scrim").addEventListener("click", closeMobileNav);
  registerActions({ "app.lock": ()=>lockWorkspace("manual") });
  window.addEventListener("resize", ()=>applySidebarPrefs());
  window.addEventListener("beforeunload", ()=>{ if(!Store.data) return; try{ Store.persistNow(); }catch(err){} });
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "hidden" && Store.data){ clearTimeout(Store._saveTimer); Store.persistNow(); }
  });
  document.addEventListener("paste", (e)=>{
    if(Router.current !== "album" || !AlbumState.unlocked) return;
    const t = e.target;
    if(t && t.closest && t.closest("input, textarea, [contenteditable='true']")) return;
    handleAlbumPasteEvent(e);
  });
  document.addEventListener("dragover", (e)=>{
    if(Router.current !== "album" || !AlbumState.unlocked) return;
    const types = e.dataTransfer && e.dataTransfer.types;
    if(types && Array.from(types).includes("Files")){ e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect = "copy"; }
  });
  document.addEventListener("drop", (e)=>{
    if(Router.current !== "album" || !AlbumState.unlocked) return;
    const files = e.dataTransfer && e.dataTransfer.files;
    if(!files || !files.length) return;
    const imgs = Array.from(files).filter((f)=> f.type && f.type.indexOf("image/") === 0);
    if(!imgs.length) return;
    e.preventDefault();
    imgs.forEach((f)=>{
      if(DEMO_MODE && (Store.data.album||[]).length >= DEMO_LIMITS.albumFiles){ openDemoUpsell("Personal Album images", DEMO_LIMITS.albumFiles); return; }
      addAlbumImageFromFile(f).catch((err)=>{ UI.toast("Could not add the dropped image.","error"); });
    });
  });
  document.addEventListener("paste", (e)=>{
    if(Router.current !== "drive" || !DriveState.unlocked) return;
    const t = e.target;
    if(t && t.closest && t.closest("input, textarea, [contenteditable='true']")) return;
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    const files = [];
    for(let i=0;i<items.length;i++){
      const it = items[i];
      if(it.kind === "file"){ const f = it.getAsFile(); if(f) files.push(f); }
    }
    if(!files.length) return;
    e.preventDefault();
    (async ()=>{
      let added = 0, failed = 0, blocked = false;
      for(const f of files){
        if(DEMO_MODE && driveFileCount() >= DEMO_LIMITS.driveFiles){
          if(!blocked){ openDemoUpsell("Personal Drive files", DEMO_LIMITS.driveFiles); blocked = true; }
          break;
        }
        try{ const r = await driveImportFileWithSuggestion(f, DriveState.cwd); if(r) added++; }
        catch(err){ failed++; UI.toast(err.message || "Could not add that file.", "error"); }
      }
      if(added || failed){
        Store.save(); refresh();
        UI.toast(`Added ${added} file${added===1?"":"s"}${failed ? ` (${failed} failed)` : ""}.`, added ? "success" : "error");
      }
    })();
  });
}
function boot(){
  Theme.apply(Store.prefs().theme || "light");
  bindGlobalControls();
  SearchPanel.init();
  wireAppStorageBridge();
  wireAppFileBridge();
  applySidebarPrefs();
  if(!Store.exists()){ showSetup(); return; }
  showLock();
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
