<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="WaceSpork — a local-first personal workspace (Demo).">
<title>WaceSpork — Personal Workspace (Demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230f172a'/%3E%3Cstop offset='1' stop-color='%231e293b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-size='38' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg1:#f4f4f6;--bg2:#eeeef1;--bg3:#f9f9fb;
  --surface:rgba(255,255,255,.9);--surface-solid:#ffffff;
  --surface-2:#f4f4f6;--surface-3:#e9e9ed;
  --border:rgba(15,23,42,.08);--border-strong:rgba(15,23,42,.16);
  --text:#0f172a;--text-2:#475569;--text-3:#94a3b8;
  --accent:#0f172a;--accent-hover:#1e293b;--accent-soft:rgba(15,23,42,.06);--accent-text:#ffffff;
  --danger:#dc2626;--danger-soft:rgba(220,38,38,.10);
  --success:#10b981;--warn:#f59e0b;
  --violet:#8b5cf6;--violet-soft:rgba(139,92,246,.14);
  --buy1:#f59e0b;--buy2:#f97316;--buy-soft:rgba(245,158,11,.14);
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);--shadow-sm:0 2px 6px rgba(15,23,42,.06);
  --shadow-md:0 10px 30px rgba(15,23,42,.08);--shadow-lg:0 24px 60px rgba(15,23,42,.16);
  --radius:14px;--radius-sm:9px;--radius-lg:20px;
  --sidebar-w:250px;--topbar-h:60px;
}
[data-theme="dark"]{
  --bg1:#101114;--bg2:#0c0d10;--bg3:#141519;
  --surface:rgba(24,25,29,.85);--surface-solid:#18191d;
  --surface-2:#202126;--surface-3:#2a2c32;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);
  --text:#f1f2f4;--text-2:#a8abb3;--text-3:#6b6e78;
  --accent:#f1f2f4;--accent-hover:#ffffff;--accent-soft:rgba(241,242,244,.10);--accent-text:#101114;
  --danger:#ef4444;--danger-soft:rgba(239,68,68,.13);
  --success:#34d399;--warn:#fbbf24;
  --violet:#a78bfa;--violet-soft:rgba(167,139,250,.16);
  --buy1:#f0b429;--buy2:#fb923c;--buy-soft:rgba(240,180,41,.16);
  --shadow-xs:0 1px 2px rgba(0,0,0,.35);--shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --shadow-md:0 12px 34px rgba(0,0,0,.5);--shadow-lg:0 26px 64px rgba(0,0,0,.65);
}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--text);
  background:radial-gradient(1200px 700px at 12% -10%,var(--bg3),transparent 60%),radial-gradient(1000px 600px at 100% 0%,var(--bg2),transparent 55%),linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.resizing-sidebar{cursor:col-resize;user-select:none}
body.resizing-sidebar *{cursor:col-resize !important;user-select:none !important}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.015em}
h1{font-size:1.45rem}h2{font-size:1.1rem}h3{font-size:.98rem}
p{margin:0}button,input,select,textarea{font:inherit;color:inherit}a{color:var(--accent)}
.hidden{display:none !important}.muted{color:var(--text-2);font-size:.87rem}.tiny{font-size:.78rem;color:var(--text-3)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-lg{width:22px;height:22px}.ic-sm{width:15px;height:15px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-solid);color:var(--text);font-size:.87rem;font-weight:550;cursor:pointer;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s;white-space:nowrap;box-shadow:var(--shadow-xs)}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-text)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn.danger:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn[disabled],.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--text-2);cursor:pointer;flex:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.icon-btn.sm{width:28px;height:28px;border-radius:7px}
.icon-btn[disabled]{opacity:.3;pointer-events:none}

/* Demo additions */
.demo-badge{display:inline-flex;align-items:center;font-size:.6rem;font-weight:800;letter-spacing:.1em;padding:2.5px 7px;border-radius:6px;background:linear-gradient(135deg,var(--buy1),var(--buy2));color:#fff;margin-left:4px;text-transform:uppercase;box-shadow:0 2px 6px rgba(245,158,11,.35);flex:none}
.buy-btn{background:linear-gradient(135deg,var(--buy1),var(--buy2)) !important;border-color:transparent !important;color:#fff !important;box-shadow:0 4px 14px rgba(245,158,11,.3) !important;font-weight:650 !important}
.buy-btn:hover{filter:brightness(1.06)}
.buy-btn .ic{stroke:#fff}
.sidebar-buy{background:linear-gradient(135deg,var(--buy1),var(--buy2)) !important;color:#fff !important;border-color:transparent !important;box-shadow:0 4px 12px rgba(245,158,11,.22) !important}
.sidebar-buy:hover{filter:brightness(1.06);color:#fff !important}
.sidebar-buy .ic{stroke:currentColor}
.sidebar.compact .sidebar-buy{justify-content:center;padding:11px 0}
.demo-hero{display:flex;align-items:flex-start;gap:14px;padding:16px;border-radius:12px;background:linear-gradient(135deg,var(--buy-soft),transparent);border:1px solid var(--buy1)}
.demo-hero .ic{color:var(--buy2);flex:none;margin-top:2px}
@media (max-width:720px){
  .buy-btn .buy-text{display:none}
  .buy-btn{padding:6px 9px !important}
  .buy-btn .ic{width:16px;height:16px}
}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.label{font-size:.82rem;font-weight:600;color:var(--text-2)}
.input,select.input,textarea.input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-solid);transition:border-color .15s,box-shadow .15s;font-size:.9rem}
textarea.input{resize:vertical;min-height:90px;line-height:1.6}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--text-3)}
select.input{cursor:pointer}
input[type="range"].input{padding:0;height:auto;border:0;background:transparent;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1;min-width:130px}
.checkline{display:flex;align-items:center;gap:9px;font-size:.88rem;cursor:pointer;color:var(--text-2)}

.card{background:var(--surface);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border)}

.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;z-index:60;overflow:auto}
.setup-card{width:100%;max-width:520px;padding:30px;border-radius:var(--radius-lg);background:var(--surface);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--border);box-shadow:var(--shadow-lg);animation:rise .4s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:36px;height:36px;border-radius:11px;flex:none;background:linear-gradient(140deg,var(--accent),var(--accent-hover));display:flex;align-items:center;justify-content:center;color:var(--accent-text);font-weight:750;font-size:1rem;letter-spacing:-.03em;box-shadow:0 6px 16px rgba(15,23,42,.28)}
.brand-name{font-weight:700;letter-spacing:-.02em}
.steps{display:flex;gap:6px;margin:22px 0 20px}
.step-dot{height:4px;flex:1;border-radius:4px;background:var(--surface-3);transition:background .3s}
.step-dot.on{background:var(--accent)}
.step-title{font-size:1.28rem;font-weight:680;letter-spacing:-.02em;margin-bottom:6px}
.step-sub{color:var(--text-2);font-size:.89rem;margin-bottom:22px}
.setup-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

.avatar{border-radius:50%;object-fit:cover;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:650;color:#fff;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-pick{display:flex;align-items:center;gap:16px}
.avatar-96{width:84px;height:84px;font-size:1.7rem}

.pin-row{display:flex;gap:10px;justify-content:center;margin:6px 0 4px}
.pin-cell{width:50px;height:58px;text-align:center;font-size:1.35rem;font-weight:650;border-radius:12px;border:1.5px solid var(--border);background:var(--surface-solid);transition:border-color .15s,box-shadow .15s;letter-spacing:.06em;-webkit-text-security:disc}
.pin-cell:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pin-cell.filled{border-color:var(--border-strong)}
.pin-error{color:var(--danger);font-size:.83rem;text-align:center;margin-top:10px;min-height:20px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.lock-name{text-align:center;font-weight:650;font-size:1.05rem}
.lock-sub{text-align:center;color:var(--text-2);font-size:.85rem;margin-bottom:20px}

.theme-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.theme-opt{border:1.5px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;background:var(--surface-solid);text-align:left;transition:border-color .15s,box-shadow .15s}
.theme-opt:hover{border-color:var(--border-strong)}
.theme-opt.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-prev{height:74px;border-radius:9px;margin-bottom:10px;overflow:hidden;border:1px solid var(--border);position:relative}
.theme-prev.light{background:linear-gradient(160deg,#f4f4f6,#e9e9ed)}
.theme-prev.dark{background:linear-gradient(160deg,#101114,#0c0d10)}
.theme-prev::after{content:"";position:absolute;left:8px;top:8px;right:38%;bottom:8px;border-radius:6px;background:rgba(255,255,255,.85)}
.theme-prev.dark::after{background:rgba(255,255,255,.14)}

#shell{display:flex;flex-direction:column;height:100dvh;height:100vh;overflow:hidden}
.topbar{height:var(--topbar-h);flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);position:relative;z-index:30}
.topbar .spacer{flex:1}
.top-actions{display:flex;align-items:center;gap:6px}
.profile-chip{display:flex;align-items:center;gap:9px;padding:4px 11px 4px 4px;border-radius:99px;border:1px solid var(--border);background:var(--surface-solid);cursor:pointer}
.profile-chip:hover{border-color:var(--border-strong)}
.profile-chip .avatar{width:28px;height:28px;font-size:.78rem}
.profile-chip span{font-size:.85rem;font-weight:550;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-status{font-size:.78rem;color:var(--text-3);display:flex;align-items:center;gap:5px;min-width:110px;justify-content:flex-end}
.dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex:none}
.dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.menu-btn{display:none}

.layout{flex:1;display:flex;min-height:0;position:relative}

.sidebar{width:var(--sidebar-w);flex:none;border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:3px;background:var(--surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);overflow-y:auto;z-index:20;position:relative;transition:width .18s ease}
.sidebar.no-transition{transition:none}
.sidebar-resize-handle{position:absolute;top:0;bottom:0;right:-4px;width:8px;border:0;padding:0;background:transparent;cursor:col-resize;z-index:21;touch-action:none}
.sidebar-resize-handle::before{content:"";position:absolute;top:50%;transform:translateY(-50%);right:3px;width:2px;height:32px;border-radius:2px;background:transparent;transition:background .15s}
.sidebar-resize-handle:hover,.sidebar-resize-handle.active{background:var(--accent-soft)}
.sidebar-resize-handle:hover::before,.sidebar-resize-handle.active::before{background:var(--accent)}
.sidebar.compact{--sidebar-w:74px;padding:14px 10px;align-items:center}
.sidebar.compact .nav-item{justify-content:center;padding:11px 0}
.sidebar.compact .nav-item span,.sidebar.compact .nav-item .badge,.sidebar.compact .sidebar-foot .nav-item span,.sidebar.compact .nav-label{display:none}
.sidebar.compact .sidebar-foot{width:100%}
.sidebar.compact .sidebar-resize-handle{display:none}
.sidebar.arranging .nav-main .nav-item{cursor:grab;border:1px dashed var(--border-strong)}
.sidebar.arranging .nav-main .nav-item:active{cursor:grabbing}
.sidebar.arranging .nav-main .nav-item.dragging{opacity:.4}
.sidebar.arranging .nav-main .nav-item.drag-over-top{box-shadow:0 -2px 0 0 var(--accent) inset}
.sidebar.arranging .nav-main .nav-item.drag-over-bottom{box-shadow:0 2px 0 0 var(--accent) inset}
.nav-main{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-size:.89rem;font-weight:530;text-align:left;width:100%;transition:background .15s,color .15s}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:620}
.nav-item.active .ic{stroke-width:2.1}
.nav-item .badge{margin-left:auto;font-size:.72rem;color:var(--text-3);font-weight:600}
.nav-item .lock-ico{margin-left:auto;opacity:.5}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:19;border:0;padding:0}

.main{flex:1;min-width:0;overflow-y:auto;padding:24px 26px 60px}
.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.view-head .sub{color:var(--text-2);font-size:.87rem;margin-top:3px}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.grid{display:grid;gap:14px}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-auto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid-apps{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.grid-drive{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;color:#fff;overflow:hidden;background:linear-gradient(140deg,hsl(var(--h) 68% 56%),hsl(var(--h) 70% 44%))}
.tile img{width:100%;height:100%;object-fit:cover}
.tile.tile-has-icon{position:relative}
.tile.tile-has-icon > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.sm{width:34px;height:34px;border-radius:9px;font-size:.85rem}
.tile.lg{width:48px;height:48px;border-radius:14px}

.shortcut-card{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-xs);transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
.shortcut-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.shortcut-card.selectable{cursor:pointer}
.shortcut-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.shortcut-top{display:flex;align-items:flex-start;gap:12px}
.shortcut-name{font-weight:620;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shortcut-url{font-size:.78rem;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shortcut-desc{font-size:.82rem;color:var(--text-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shortcut-foot{display:flex;align-items:center;gap:6px;margin-top:auto}
.card-actions{position:absolute;top:10px;right:10px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.shortcut-card:hover .card-actions,.shortcut-card:focus-within .card-actions{opacity:1}
.meeting-card .card-actions{opacity:1}
@media (hover:none){.card-actions{opacity:1}}

.list-row{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);transition:background .15s}
.list-row:hover{background:var(--surface-2)}
.list-row.selectable{cursor:pointer}
.list-row.selected{border-color:var(--accent);background:var(--accent-soft)}
.list-row .grow{flex:1;min-width:0}
.list-row .name{font-weight:580;font-size:.9rem;display:flex;align-items:center;gap:7px}
.list-row .meta{font-size:.78rem;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .row-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap}

.cal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.cal-head .month{font-size:1.05rem;font-weight:660;letter-spacing:-.01em;min-width:170px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 14px 4px;gap:6px}
.cal-dow div{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:6px 14px 16px}
.cal-cell{min-height:96px;border-radius:11px;border:1px solid transparent;background:var(--surface-2);padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;transition:background .15s,border-color .15s}
.cal-cell:hover{background:var(--surface-3);border-color:var(--border)}
.cal-cell.out{opacity:.42}
.cal-cell.today{background:var(--accent-soft);border-color:var(--accent)}
.cal-daynum{font-size:.79rem;font-weight:650;color:var(--text-2)}
.cal-cell.today .cal-daynum{color:var(--accent)}
.cal-ev{font-size:.71rem;font-weight:550;padding:2.5px 6px;border-radius:6px;background:var(--accent);color:var(--accent-text);border:none;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;width:100%}
.cal-ev.alt{background:#64748b;color:#fff}
.cal-ev.alt2{background:#10b981;color:#fff}
.cal-ev.meeting{background:var(--violet);color:#fff;display:inline-flex;align-items:center;gap:4px;padding:2.5px 6px}
.cal-ev.meeting .ic{flex:none;width:11px;height:11px;stroke-width:2.2}
.cal-ev.meeting span.ev-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cal-more{font-size:.68rem;color:var(--text-3);font-weight:600;padding-left:2px}
.ev-list-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;cursor:pointer;border:1px solid transparent}
.ev-list-row:hover{background:var(--surface-2);border-color:var(--border)}

.notes-editor{flex:1;width:100%;border:0;resize:none;padding:22px 26px;background:transparent;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.875rem;line-height:1.72;min-height:340px;color:var(--text);white-space:pre;overflow:auto}

.contact-row{display:flex;align-items:center;gap:15px;padding:15px 18px;border-bottom:1px solid var(--border);transition:background .15s}

.meeting-card{padding:17px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-xs);display:flex;flex-direction:column;gap:11px;position:relative}

.app-tile{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 10px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;box-shadow:var(--shadow-xs)}

.app-html-badge{display:inline-flex;align-items:center;font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1.5px 5px;border-radius:5px;background:var(--violet-soft);color:var(--violet);margin-top:2px}

.settings-grid{display:grid;gap:16px;max-width:880px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:58px 24px;text-align:center}

.modal-backdrop{position:fixed;inset:0;background:rgba(10,14,22,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80;animation:fade .18s ease;overflow-y:auto}

#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:12px;background:var(--surface-solid);border:1px solid var(--border);box-shadow:var(--shadow-md);font-size:.86rem;font-weight:520;animation:rise .25s cubic-bezier(.2,.8,.3,1);max-width:100%}

.info-box{display:flex;gap:11px;padding:13px 15px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);font-size:.83rem;line-height:1.55;color:var(--text-2)}

.home-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:start}

.widget{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-xs);display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:box-shadow .15s,border-color .15s}

.todo-list{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow-y:auto;margin:0 -4px;padding:0 4px}

.search-backdrop{position:fixed;inset:0;background:rgba(10,14,22,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:95;display:flex;align-items:flex-start;justify-content:center;padding:72px 18px 24px;animation:fade .15s ease}
.search-panel{width:100%;max-width:620px;background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:74dvh;overflow:hidden;animation:pop .2s cubic-bezier(.2,.8,.3,1)}
.search-input-wrap{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex:none}

.search-empty{padding:42px 20px;text-align:center;color:var(--text-3);font-size:.86rem}
.search-hint{padding:8px 14px;border-top:1px solid var(--border);display:flex;gap:14px;font-size:.72rem;color:var(--text-3);flex:none;flex-wrap:wrap}
.search-hint kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.68rem;padding:1px 5px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}

.html-panel-backdrop{position:fixed;inset:0;background:rgba(10,14,22,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .18s ease}

.html-panel-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);flex:none;flex-wrap:wrap}
.html-panel-title{font-weight:620;font-size:.88rem;flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.html-zoom{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:9px;background:var(--surface-solid);border:1px solid var(--border)}
.html-zoom input[type="range"]{width:110px;accent-color:var(--accent);cursor:pointer}
.html-zoom .zoom-val{font-size:.76rem;font-weight:650;min-width:44px;text-align:center;color:var(--text-2);cursor:pointer;background:transparent;border:0;padding:4px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.html-zoom .zoom-val:hover{background:var(--surface-2);color:var(--accent)}
.html-panel-body{flex:1;position:relative;overflow:hidden;background:var(--surface-3);--zoom:1}
.html-panel-frame{position:absolute;top:0;left:0;width:calc(100% / var(--zoom));height:calc(100% / var(--zoom));transform:scale(var(--zoom));transform-origin:0 0;border:0;background:#fff;display:block}
.html-app-badges{position:fixed;right:20px;bottom:20px;z-index:65;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.html-app-badges:empty{display:none}
.html-panel-badge{pointer-events:auto;display:flex;align-items:stretch;width:240px;background:var(--surface-solid);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;animation:rise .22s cubic-bezier(.2,.8,.3,1)}
.html-panel-badge .badge-main{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:10px 14px;border:0;background:transparent;cursor:pointer;color:var(--text);font-size:.85rem;font-weight:550;font-family:inherit;text-align:left}
.html-panel-badge .badge-main:hover{background:var(--surface-2)}
.html-panel-badge .badge-dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex:none;box-shadow:0 0 0 3px rgba(16,185,129,.16)}
.html-panel-badge .badge-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.html-panel-badge .badge-x{flex:none;width:40px;border:0;background:transparent;border-left:1px solid var(--border);cursor:pointer;color:var(--text-3);display:flex;align-items:center;justify-content:center}
.html-panel-badge .badge-x:hover{background:var(--danger-soft);color:var(--danger)}

.album-paste-zone{border:1.5px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface);padding:24px;text-align:center;transition:background .15s,border-color .15s,color .15s;cursor:pointer;user-select:none}
.album-paste-zone:hover,.album-paste-zone:focus-visible{background:var(--surface-2);border-color:var(--accent);color:var(--accent);outline:none}
.album-row{cursor:pointer}
.album-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.drive-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.drive-breadcrumb{display:flex;align-items:center;gap:4px;font-size:.85rem;flex:1;min-width:0;flex-wrap:wrap}
.drive-crumb{background:transparent;border:0;padding:3px 7px;border-radius:6px;cursor:pointer;color:var(--text-2);font-size:.85rem;font-family:inherit}
.drive-crumb:hover{background:var(--surface-3);color:var(--text)}
.drive-crumb.current{color:var(--text);font-weight:600}
.drive-crumb-sep{color:var(--text-3);user-select:none}
.drive-dropzone{position:relative}
.drive-dropzone.dragover{outline:2px dashed var(--accent);outline-offset:4px;border-radius:var(--radius)}
.drive-dropzone.dragover::after{content:"Drop files to upload";position:absolute;inset:8px;background:var(--accent-soft);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:600;pointer-events:none;z-index:2}

.drive-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;box-shadow:var(--shadow-xs);text-align:center;min-width:0}
.drive-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.drive-tile.selectable{cursor:pointer}
.drive-tile.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transform:translateY(-2px)}
.drive-tile .dt-thumb{width:100%;height:96px;border-radius:8px;background:var(--surface-2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.drive-tile .dt-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.drive-tile .dt-name{font-size:.82rem;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.drive-tile .dt-meta{font-size:.7rem;color:var(--text-3)}
.drive-tile .tile-actions{position:absolute;top:6px;right:6px;display:flex;gap:1px;opacity:0;transition:opacity .15s}
.drive-tile:hover .tile-actions,.drive-tile:focus-within .tile-actions{opacity:1}
@media (hover:none){.drive-tile .tile-actions{opacity:1}}
.drive-tile .sel-check{position:absolute;top:8px;left:8px;z-index:1}
.drive-folder-ico{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#f5c542,#e0a800);color:#fff;flex:none}
.drive-folder-ico .ic{width:24px;height:24px;stroke-width:1.6}

.preview-stage{background:#0b0e14;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:center;min-height:240px;max-height:68vh;overflow:auto}
.preview-stage img{max-width:100%;max-height:64vh;display:block;border-radius:6px}
.preview-stage iframe{width:100%;height:64vh;border:0;background:#fff;border-radius:6px}
.preview-text{background:var(--surface-2);border-radius:10px;padding:14px;max-height:60vh;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;line-height:1.55;color:var(--text)}
.preview-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.8rem;color:var(--text-2);margin-top:12px}
.preview-meta .k{color:var(--text-3)}

.sel-check{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-strong);background:var(--surface-solid);flex:none;color:transparent;transition:background .12s,border-color .12s,color .12s}
.sel-check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.sel-check .ic{width:12px;height:12px;stroke-width:3}
.shortcut-card .sel-check,.app-tile .sel-check{position:absolute;top:8px;left:8px;z-index:1}
.selection-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:12px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent);flex-wrap:wrap}
.selection-bar .sb-count{font-weight:600;font-size:.88rem;color:var(--accent);min-width:90px}
.selection-bar .sb-grow{flex:1}

/* Notepad select-mode: stacked layout so it always fits inside the 266px pane */
.notes-side-head .sel-bar-stack{display:flex;flex-direction:column;gap:6px;width:100%;box-sizing:border-box;overflow:hidden}
.notes-side-head .sel-bar-stack .sel-bar-mini{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;box-sizing:border-box;padding:6px 8px;border-radius:8px;
  background:var(--accent-soft);border:1px solid var(--accent);
  font-size:.78rem;color:var(--accent);font-weight:600;
}
.notes-side-head .sel-bar-actions{display:flex;gap:5px;width:100%;box-sizing:border-box;min-width:0}
.notes-side-head .sel-bar-actions .btn{
  flex:1 1 0;min-width:0;padding:5px 6px;font-size:.74rem;gap:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

@media (max-width:720px){
  .html-panel-backdrop{padding:10px}
  .html-panel{width:100vw;height:88vh}
  .html-zoom input[type="range"]{width:70px}
  .html-app-badges{right:12px;bottom:12px}
  .html-panel-badge{width:200px}
}
@media (max-width:1080px){
  :root{--sidebar-w:74px !important}
  .sidebar{padding:14px 10px;align-items:center}
  .sidebar .nav-item{justify-content:center;padding:11px 0}
  .sidebar .nav-item span,.sidebar .nav-item .badge,.sidebar .nav-item .lock-ico,.sidebar .sidebar-foot .nav-item span,.sidebar .nav-label{display:none}
  .sidebar .sidebar-foot{width:100%}
  .sidebar-resize-handle{display:none}
}
@media (max-width:900px){
  .home-grid{grid-template-columns:repeat(4,1fr)}
  .widget.w-s{grid-column:span 2}
  .widget.w-m,.widget.w-l{grid-column:span 4}
  .add-widget-tile{grid-column:span 2}
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .notes-layout{grid-template-columns:1fr}
  .notes-side{border-right:0;border-bottom:1px solid var(--border);max-height:250px}
  .main{padding:18px 16px 60px}
}
@media (max-width:720px){
  :root{--sidebar-w:270px !important;--topbar-h:56px}
  .menu-btn{display:inline-flex}
  .sidebar{position:fixed;top:var(--topbar-h);bottom:0;left:0;z-index:45;transform:translateX(-102%);transition:transform .26s cubic-bezier(.2,.8,.3,1);align-items:stretch;padding:14px 10px;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .sidebar .nav-item{justify-content:flex-start;padding:10px 12px}
  .sidebar .nav-item span,.sidebar .nav-item .badge,.sidebar .nav-item .lock-ico,.sidebar .sidebar-foot .nav-item span,.sidebar .nav-label{display:inline}
  .sidebar-resize-handle{display:none}
  .grid-3,.grid-auto{grid-template-columns:1fr}
  .grid-apps{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .cal-cell{min-height:64px;padding:4px;border-radius:9px}
  .cal-ev{font-size:0;padding:0;height:6px;border-radius:3px}
  .cal-ev.meeting{font-size:0;padding:0;height:6px;gap:0}
  .cal-ev.meeting .ic{display:none}
  .cal-more{font-size:.62rem}
  .cal-head .month{min-width:0;font-size:.95rem}
  .cal-dow div{font-size:.62rem}
  .setup-card{padding:22px}
  .pin-cell{width:44px;height:52px;font-size:1.15rem}
  .modal-foot{flex-direction:column-reverse}
  .modal-foot .btn{width:100%}
  .save-status{display:none}
  .contact-details .cd span{max-width:150px}
  .contact-row{padding:12px 14px;gap:11px}
  .contact-row .avatar{width:38px;height:38px;font-size:.9rem}
  .head-actions .input{min-width:0 !important;width:100%}
  .crop-box{width:240px;height:240px}
  .search-backdrop{padding:60px 12px 12px}
}
@media (max-width:640px){
  .home-grid{grid-template-columns:1fr}
  .widget.w-s,.widget.w-m,.widget.w-l{grid-column:span 1}
  .add-widget-tile{grid-column:span 1}
}
@media (max-width:400px){
  .pin-cell{width:40px;height:48px}
  .grid-3{grid-template-columns:1fr}
  .crop-box{width:210px;height:210px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

<script>
    "use strict";

window.addEventListener("error", (e)=>{
  try{ console.error("[WaceSpork] Uncaught error:", (e && (e.error || e.message)) || e); }catch(_){}
});
window.addEventListener("unhandledrejection", (e)=>{

/* ---- DEMO CONFIG ---- */
const DEMO_MODE = true;
const BUY_URL = "https://poomrcd.gumroad.com/l/cavqna";
const DEMO_LIMITS = {
  widgets: 3, events: 3, notes: 3, contacts: 3, meetings: 3,

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();
const pad2 = (n) => String(n).padStart(2, "0");
const isoDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayISO = () => isoDate(new Date());
function fmtDateLong(iso){ if(!iso) return ""; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"}); }
function userTimeFormat(){ return (Store.data && Store.data.settings && Store.data.settings.timeFormat === "12") ? "12" : "24"; }
function fmtTime24(hhmm){
  if(!hhmm) return "";
  const m = /^(\d{1,2}):(\d{2})/.exec(String(hhmm).trim());
  if(!m) return String(hhmm);
  let h = Number(m[1]); const min = m[2];
  if(h > 23 || h < 0) h = 0;
  return `${pad2(h)}:${min}`;
}
function fmtTimeDisplay(hhmm){
  if(!hhmm) return "";
  const m = /^(\d{1,2}):(\d{2})/.exec(String(hhmm).trim());
  if(!m) return String(hhmm);
  let h = Number(m[1]); const min = m[2];
  if(h > 23 || h < 0) h = 0;
  if(userTimeFormat() === "24") return `${pad2(h)}:${min}`;
  const period = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return `${h12}:${min} ${period}`;
}
function fmtClock(d){
  if(!d) return "";
  const dt = d instanceof Date ? d : new Date(d);
  if(isNaN(dt)) return "";
  const is12 = userTimeFormat() === "12";
  return dt.toLocaleTimeString(undefined, { hour: is12 ? "numeric" : "2-digit", minute: "2-digit", hour12: is12 });
}
function fmtDateTime(d){
  if(!d) return "";
  const dt = d instanceof Date ? d : new Date(d);
  if(isNaN(dt)) return "";
  return dt.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) + " · " + fmtClock(dt);
}
function addHour(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm||"").trim());
  if(!m) return "";
  let h = Number(m[1]); const min = m[2];
  if(isNaN(h)) return hhmm;
  h = (h + 1) % 24;
  return `${pad2(h)}:${min}`;
}
function initials(name){ const p=String(name||"").trim().split(/\s+/).filter(Boolean); if(!p.length) return "?";
  return p.slice(0,2).map((w)=>w[0]).join("").toUpperCase(); }
function hueFor(str){ let h=0; for(const ch of String(str||"?")) h=(h*31+ch.charCodeAt(0))%360; return h; }
function domainOf(url){ try{ return new URL(normalizeUrl(url)).hostname.replace(/^www\./,""); }catch{ return String(url||""); } }
function normalizeUrl(raw){ let s=String(raw||"").trim(); if(!s) return "";
  if(!/^[a-z][a-z0-9+.-]*:/i.test(s)) s="https://"+s; return s; }
function isValidUrl(raw){ try{ const u=new URL(normalizeUrl(raw)); return u.protocol==="http:"||u.protocol==="https:"; }catch{ return false; } }
function openExternal(url){ const u=normalizeUrl(url);
  if(!isValidUrl(u)){ UI.toast("That link does not look valid.","error"); return; }
  window.open(u,"_blank","noopener,noreferrer"); }
function debounce(fn,ms){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args),ms); }; }
function escapeAttr(s){ return esc(s); }
function formatBytes(n){
  if(!n) return "0 B";
  const units = ["B","KB","MB","GB"];
  let i = 0; let v = Number(n);
  while(v >= 1024 && i < units.length - 1){ v /= 1024; i++; }
  return v.toFixed(v < 10 && i > 0 ? 1 : 0) + " " + units[i];
}
function utf8Bytes(str){ try{ return new Blob([String(str||"")]).size; }catch(e){ return String(str||"").length; } }
function base64DataUrlBytes(dataUrl){
  const m = /^data:[^;]+;base64,(.*)$/.exec(String(dataUrl||""));
  if(!m) return utf8Bytes(dataUrl);
  return Math.round(m[1].length * 0.75);
}
function fsBase64Bytes(b64){
  const s = String(b64||"");
  const pad = s.endsWith("==") ? 2 : s.endsWith("=") ? 1 : 0;
  return Math.max(0, Math.round((s.length * 3) / 4) - pad);
}
async function copyToClipboard(text){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{ const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    const ok=document.execCommand("copy"); ta.remove(); return ok; }catch(e){ return false; }
}
function readFileAsText(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(String(r.result || ""));
    r.onerror = ()=>reject(new Error("Could not read the file."));
    try{ r.readAsText(file); }catch(e){ reject(e); }
  });
}
function readFileAsDataUrl(file){ return new Promise((resolve,reject)=>{
  const r = new FileReader(); r.onload=()=>resolve(r.result);
  r.onerror=()=>reject(new Error("Could not read that file.")); r.readAsDataURL(file); }); }
function loadImage(dataUrl){ return new Promise((resolve,reject)=>{
  const img = new Image(); img.onload=()=>resolve(img);
  img.onerror=()=>reject(new Error("Could not load that image.")); img.src=dataUrl; }); }

/* MIME and extension helpers */
const MIME_FROM_EXT = {
  csv:"text/csv", txt:"text/plain", html:"text/html", htm:"text/html",
  json:"application/json", md:"text/markdown", xml:"text/xml",
  svg:"image/svg+xml", js:"application/javascript", css:"text/css",
  yml:"text/yaml", yaml:"text/yaml", log:"text/plain",
  xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  xls:"application/vnd.ms-excel",
  pdf:"application/pdf", zip:"application/zip",
  png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg",
  gif:"image/gif", webp:"image/webp",
  doc:"application/msword",
  docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"
};
const TEXT_EXTS = new Set(["csv","txt","html","htm","json","md","xml","svg","js","css","yml","yaml","log"]);
const IMAGE_EXTS = new Set(["png","jpg","jpeg","gif","webp","svg","bmp","ico","avif"]);
function extOf(path){ const m = /\.([a-z0-9]+)$/i.exec(String(path||"")); return m ? m[1].toLowerCase() : ""; }
function guessMime(path){ return MIME_FROM_EXT[extOf(path)] || "application/octet-stream"; }
function isTextExt(ext){ return TEXT_EXTS.has(ext); }
function isImageExt(ext){ return IMAGE_EXTS.has(ext); }
function isPdfExt(ext){ return ext === "pdf"; }
function isSpreadsheetExt(ext){ return ext === "xlsx" || ext === "xls" || ext === "csv"; }

/* [B] SECURITY */
const Security = (() => {
  const enc = new TextEncoder(); const dec = new TextDecoder();
  const VERIFIER = "wacespork.verifier.v1"; const ITERATIONS = 120000;
  const available = !!(window.crypto && window.crypto.subtle && typeof window.crypto.subtle.deriveKey === "function");
  function b64encode(buf){ const bytes=new Uint8Array(buf); let bin=""; const C=0x8000;
    for(let i=0;i<bytes.length;i+=C){ bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+C)); } return btoa(bin); }
  function b64decode(str){ const bin=atob(str); const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return bytes; }
  function randomBytes(n){ return window.crypto.getRandomValues(new Uint8Array(n)); }
  async function deriveKey(passphrase, saltBytes, iterations){
    const base=await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:saltBytes,iterations:iterations,hash:"SHA-256"},
      base, {name:"AES-GCM",length:256}, false, ["encrypt","decrypt"]); }
  async function aesEncrypt(key, plaintext){ const iv=randomBytes(12);
    const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv}, key, enc.encode(plaintext));
    return { iv: b64encode(iv), ct: b64encode(ct) }; }
  async function aesDecrypt(key, payload){
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64decode(payload.iv)}, key, b64decode(payload.ct));
    return dec.decode(pt); }
  function weakHash(str){ let h=0x811c9dc5;
    for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16); }
  return { available, iterations: ITERATIONS,
    async createRecord(pin){
      if(!available) return { record:{v:1,mode:"plain",check:weakHash(pin)}, key:null };
      const salt=randomBytes(16); const key=await deriveKey(pin,salt,ITERATIONS);
      const verifier=await aesEncrypt(key,VERIFIER);
      return { record:{v:1,mode:"aes",salt:b64encode(salt),iter:ITERATIONS,verifier}, key }; },
    async unlock(pin, record){
      if(!record) throw new Error("No security record");
      if(record.mode==="plain"){ if(weakHash(pin)!==record.check) throw new Error("Incorrect PIN"); return null; }
      const key=await deriveKey(pin, b64decode(record.salt), record.iter||ITERATIONS);
      let plain; try{ plain=await aesDecrypt(key, record.verifier); }catch(e){ throw new Error("Incorrect PIN"); }
      if(plain!==VERIFIER) throw new Error("Incorrect PIN"); return key; },
    async encryptJSON(key, obj){
      const text=JSON.stringify(obj);
      if(!available||!key) return {v:1,mode:"plain",data:text};
      const payload=await aesEncrypt(key,text); return {v:1,mode:"aes",...payload}; },
    async decryptJSON(key, envelope){
      if(!envelope) return null;
      if(envelope.mode==="plain") return JSON.parse(envelope.data);
      if(!key) throw new Error("Locked");
      return JSON.parse(await aesDecrypt(key,envelope)); },
    async encryptBackup(password, obj){
      if(!available) throw new Error("Encrypted backups need Web Crypto (serve over https:// or localhost).");
      const salt=randomBytes(16); const key=await deriveKey(password,salt,ITERATIONS);
      const payload=await aesEncrypt(key, JSON.stringify(obj));
      return { format:"wacespork-backup-encrypted", v:1, alg:"PBKDF2-SHA256/AES-GCM",
        iter:ITERATIONS, salt:b64encode(salt), ...payload }; },
    async decryptBackup(password, envelope){
      if(!available) throw new Error("This browser cannot decrypt encrypted backups.");
      if(!envelope||envelope.format!=="wacespork-backup-encrypted") throw new Error("Not an encrypted WaceSpork backup.");
      const key=await deriveKey(password, b64decode(envelope.salt), envelope.iter||ITERATIONS);
      let plain; try{ plain=await aesDecrypt(key, envelope); }
      catch(e){ throw new Error("Incorrect recovery password, or the file is damaged."); }
      return JSON.parse(plain); }
  };
})();

/* [C] STORAGE */
const SCHEMA_VERSION = 9;
const STORAGE_LIMIT_BYTES = 5 * 1024 * 1024;
const STORAGE_WARN_PCT = 80;
const IMG_MAX_DIM = 1600;
const IMG_JPEG_QUALITY = 0.7;
const IMG_MAX_BYTES = 500 * 1024;
const HTML_APP_WARN_BYTES = 500 * 1024;
const APP_STORAGE_MAX_VALUE = 500 * 1024;
const APP_STORAGE_MAX_TOTAL = 1024 * 1024;
const APP_FILE_MAX_BYTES   = 1024 * 1024;
const APP_FILES_TOTAL_MAX  = 2 * 1024 * 1024;
const APP_FILE_WARN_BYTES  = 750 * 1024;
const ALBUM_MAX_DIM = 1600;
const ALBUM_JPEG_QUALITY = 0.7;
const DRIVE_FILE_MAX_BYTES = 3 * 1024 * 1024;
const DRIVE_FILE_WARN_BYTES = 1 * 1024 * 1024;
const DRIVE_TOTAL_WARN_BYTES = 2 * 1024 * 1024;
const LS = { WORKSPACE:"wacespork.workspace", SECURITY:"wacespork.security", PREFS:"wacespork.prefs" };

function defaultSettings(theme){ return {
  theme: theme||"light", autoLockMinutes: 2,

  demoLoaded: false, lastView: "home",

function defaultWidgets(){ return [

  { id: uid(), type:"quicknote", size:"m", title:"Quick Note",         config:{ text: "" } },
  { id: uid(), type:"clock",     size:"m", title:"Clock",              config:{ showSecondTz:false, secondTz:"UTC+7" } }
]; }

function blankWorkspace(profile, theme){ return {
  version: SCHEMA_VERSION,
  createdAt: nowISO(), updatedAt: nowISO(),
  profile: { name:(profile&&profile.name)||"Me", avatar:(profile&&profile.avatar)||null },
  settings: defaultSettings(theme),
  home: { widgets: defaultWidgets() },
  schedule: [], notes: [], notesTrash: [], contacts: [], meetings: [], shortcuts: [],
  apps: defaultApps(),
  appStorage: {}, album: [],
  personalDrive: { files: {}, folders: [] }
}; }

function defaultApps(){ return []; }

function demoApps(){ const A=(name,url,color)=>({id:uid(),type:"link",name,url,color,icon:null}); return [
  A("Google","https://www.google.com","#4285f4"),
  A("ChatGPT","https://chat.openai.com","#10a37f"),
  A("YouTube","https://www.youtube.com","#ff0000")
]; }

const Store = {
  data: null, key: null, _saveTimer: null, _lastSaved: null,
  exists(){ return !!localStorage.getItem(LS.SECURITY); },
  prefs(){ try{ return JSON.parse(localStorage.getItem(LS.PREFS))||{}; }catch{ return {}; } },
  setPrefs(patch){ const next={...this.prefs(),...patch};
    try{ localStorage.setItem(LS.PREFS, JSON.stringify(next)); }catch(e){}
    return next; },
  securityRecord(){ try{ return JSON.parse(localStorage.getItem(LS.SECURITY)); }catch{ return null; } },
  async create(pin, profile, theme, withDemo, importedWorkspace){
    const { record, key } = await Security.createRecord(pin);
    localStorage.setItem(LS.SECURITY, JSON.stringify(record));
    this.key = key;
    if(importedWorkspace && typeof importedWorkspace==="object"){ this.data = migrate(importedWorkspace); }
    else { this.data = blankWorkspace(profile, theme); if(withDemo) applyDemoData(this.data); }
    const effectiveTheme = (this.data.settings && this.data.settings.theme) || theme || "light";
    this.setPrefs({ theme: effectiveTheme });
    if(this.data.profile){ this.setPrefs({ lastName: this.data.profile.name || "Me", lastAvatar: this.data.profile.avatar || null }); }
    await this.persistNow();
    return this.data; },
  async unlock(pin){
    const record = this.securityRecord();
    if(!record) throw new Error("No workspace found on this device.");
    const key = await Security.unlock(pin, record);
    const raw = localStorage.getItem(LS.WORKSPACE);
    if(raw){
      let envelope; try{ envelope = JSON.parse(raw); }catch{ throw new Error("Stored workspace data is damaged."); }
      this.data = await Security.decryptJSON(key, envelope);
    } else { this.data = blankWorkspace({ name:"Me" }, this.prefs().theme||"light"); }
    this.key = key; migrate(this.data); return this.data; },
  lock(){ clearTimeout(this._saveTimer); this._saveTimer=null; this.key=null; this.data=null; },
  save(){ UI.markSaving(); clearTimeout(this._saveTimer);
    this._saveTimer=setTimeout(()=>this.persistNow(), 320); },
  async persistNow(){
    if(!this.data) return;
    this.data.updatedAt = nowISO();
    try{
      const envelope = await Security.encryptJSON(this.key, this.data);
      localStorage.setItem(LS.WORKSPACE, JSON.stringify(envelope));
      this._lastSaved = new Date(); UI.markSaved(this._lastSaved);
      setTimeout(checkStorageWarning, 60);
    }catch(err){
      const isQuota = err && (err.name==="QuotaExceededError" || err.name==="NS_ERROR_DOM_QUOTA_REACHED" || /quota/i.test(String(err&&err.message)));
      UI.markSaveFailed();
      UI.toast(isQuota ? "Browser storage is full. Export a backup and remove some large items."
                       : "Could not save your workspace. Your last changes may not be stored.", "error");
    } },
  async rekey(newPin){
    const { record, key } = await Security.createRecord(newPin);
    this.key = key; localStorage.setItem(LS.SECURITY, JSON.stringify(record));
    await this.persistNow(); },
  buildBackupObject(){
    return { format:"wacespork-backup", v:1, exportedAt:nowISO(),
      app:{ name:"WaceSpork", schemaVersion: SCHEMA_VERSION }, workspace: this.data }; },
  validateBackup(obj){
    if(!obj||typeof obj!=="object") throw new Error("That file is not valid JSON for a WaceSpork backup.");
    if(obj.format!=="wacespork-backup") throw new Error("This file was not created by WaceSpork.");
    if(!obj.workspace||typeof obj.workspace!=="object") throw new Error("The backup is missing its workspace data.");
    const w = obj.workspace;
    for(const key of ["profile","settings","schedule","notes","contacts","meetings","shortcuts","apps"]){
      if(!(key in w)) throw new Error(`The backup is missing the "${key}" section.`);
    }
    if(!Array.isArray(w.schedule)||!Array.isArray(w.notes)||!Array.isArray(w.contacts)||
       !Array.isArray(w.meetings)||!Array.isArray(w.shortcuts)||!Array.isArray(w.apps)){
      throw new Error("The backup contains malformed list data."); }
    return true; },
  async restore(workspace){ this.data = migrate(workspace); await this.persistNow(); return this.data; },
  resetAll(){ this.lock();
    [LS.WORKSPACE, LS.SECURITY, LS.PREFS].forEach((k)=>{ try{ localStorage.removeItem(k); }catch(e){} }); }
};

function snapshotProfileToPrefs(){
  if(!Store.data || !Store.data.profile) return;
  Store.setPrefs({ lastName: Store.data.profile.name || "Me", lastAvatar: Store.data.profile.avatar || null });
}

function migrate(workspace){
  if(!workspace||typeof workspace!=="object") return blankWorkspace({name:"Me"},"light");
  workspace.version = workspace.version || 1;
  workspace.profile = workspace.profile || { name:"Me", avatar:null };
  workspace.settings = Object.assign(defaultSettings("light"), workspace.settings||{});
  ["schedule","notes","notesTrash","contacts","meetings","shortcuts","apps","album"].forEach((k)=>{
    if(!Array.isArray(workspace[k])) workspace[k]=[]; });
  if(!workspace.home || typeof workspace.home!=="object") workspace.home = {};
  if(!Array.isArray(workspace.home.widgets)) workspace.home.widgets = [];
  if(Array.isArray(workspace.home.todos) && workspace.home.todos.length){
    const todoWidget = workspace.home.widgets.find((w)=>w.type==="todo");
    if(todoWidget){
      todoWidget.config = todoWidget.config || {};
      if(!Array.isArray(todoWidget.config.todos)) todoWidget.config.todos = [];
      todoWidget.config.todos.push(...workspace.home.todos);
    }
  }
  if("todos" in workspace.home) delete workspace.home.todos;
  workspace.home.widgets = workspace.home.widgets.filter((w)=>{
    if(!w || typeof w !== "object") return false;
    if(!w.type) return false;
    return ["todo","quicknote","clock","meetings","events","shortcuts","apps"].includes(w.type);
  });
  if(workspace.home.widgets.length === 0) workspace.home.widgets = defaultWidgets();
  workspace.home.widgets.forEach((w)=>{
    if(!w.id) w.id = uid();
    if(!w.size || !["s","m","l"].includes(w.size)) w.size = "m";
    if(!w.title) w.title = defaultWidgetTitle(w.type);
    if(!w.config || typeof w.config!=="object") w.config = {};
    if(w.type==="todo" && !Array.isArray(w.config.todos)) w.config.todos = [];
    if(w.type==="quicknote" && typeof w.config.text !== "string") w.config.text = "";
    if(w.type==="clock"){
      if(typeof w.config.showSecondTz !== "boolean") w.config.showSecondTz = false;
      if(!w.config.secondTz) w.config.secondTz = "UTC+7";
    }
    if((w.type==="meetings"||w.type==="events"||w.type==="shortcuts"||w.type==="apps") && !w.config.count){
      w.config.count = (w.type === "meetings" || w.type === "events") ? 3 : 6;
    }
    if(w.type==="events" && typeof w.config.excludeMeetings !== "boolean") w.config.excludeMeetings = false;
  });
  if("boards" in workspace) delete workspace.boards;
  workspace.schedule.forEach((ev)=>{
    if(typeof ev.tz !== "string") ev.tz = "";
    if(!("sourceMeetingId" in ev)) ev.sourceMeetingId = null;
  });
  workspace.meetings.forEach((m)=>{ if(!m.endTime) m.endTime = addHour(m.time) || m.time || "11:00"; });
  workspace.apps.forEach((a)=>{
    if(!a.type) a.type = "link";
    if(a.type === "html"){
      if(typeof a.htmlContent !== "string") a.htmlContent = "";
      if(typeof a.htmlSize !== "number") a.htmlSize = utf8Bytes(a.htmlContent);
      if(typeof a.url !== "string") a.url = "";
    } else {
      if(typeof a.url !== "string") a.url = "";
    }
  });
  if(!workspace.appStorage || typeof workspace.appStorage !== "object") workspace.appStorage = {};
  Object.keys(workspace.appStorage).forEach((appId)=>{
    const bucket = workspace.appStorage[appId];
    if(!bucket || typeof bucket !== "object"){ delete workspace.appStorage[appId]; return; }
    if(!bucket.local || typeof bucket.local !== "object") bucket.local = {};
    if(!bucket.session || typeof bucket.session !== "object") bucket.session = {};
    if(!bucket.files || typeof bucket.files !== "object") bucket.files = {};
    ["local","session"].forEach((area)=>{
      Object.keys(bucket[area]).forEach((k)=>{
        const v = bucket[area][k];
        if(typeof v !== "string") bucket[area][k] = String(v == null ? "" : v);
      });
    });
    Object.keys(bucket.files).forEach((k)=>{
      const f = bucket.files[k];
      if(!f || typeof f !== "object" || typeof f.content !== "string"){
        delete bucket.files[k]; return;
      }
      if(typeof f.name !== "string" || !f.name) f.name = k;
      if(typeof f.mime !== "string") f.mime = "application/octet-stream";
      if(typeof f.size !== "number") f.size = f.encoding === "base64" ? fsBase64Bytes(f.content) : utf8Bytes(f.content);
      if(typeof f.encoding !== "string") f.encoding = "utf8";
      if(typeof f.createdAt !== "string") f.createdAt = nowISO();
      if(typeof f.modifiedAt !== "string") f.modifiedAt = f.createdAt;
    });
  });
  const liveAppIds = new Set(workspace.apps.map((a)=>a.id));
  Object.keys(workspace.appStorage).forEach((appId)=>{
    if(!liveAppIds.has(appId)) delete workspace.appStorage[appId];
  });
  workspace.album = workspace.album.filter((it)=> it && typeof it === "object" && typeof it.dataUrl === "string" && it.dataUrl.indexOf("data:image/") === 0);
  workspace.album.forEach((it)=>{
    if(!it.id) it.id = uid();
    if(typeof it.name !== "string" || !it.name) it.name = "image.jpg";
    if(typeof it.size !== "number" || !it.size) it.size = base64DataUrlBytes(it.dataUrl);
    if(typeof it.addedAt !== "string") it.addedAt = nowISO();
    if(typeof it.source !== "string") it.source = "import";
  });
  if(!workspace.personalDrive || typeof workspace.personalDrive !== "object") workspace.personalDrive = { files:{}, folders:[] };
  if(!workspace.personalDrive.files || typeof workspace.personalDrive.files !== "object") workspace.personalDrive.files = {};
  if(!Array.isArray(workspace.personalDrive.folders)) workspace.personalDrive.folders = [];
  Object.keys(workspace.personalDrive.files).forEach((k)=>{
    const f = workspace.personalDrive.files[k];
    if(!f || typeof f !== "object" || typeof f.content !== "string"){
      delete workspace.personalDrive.files[k]; return;
    }
    if(typeof f.name !== "string" || !f.name) f.name = k;
    if(typeof f.mime !== "string") f.mime = guessMime(f.name);
    if(typeof f.size !== "number") f.size = f.encoding === "base64" ? fsBase64Bytes(f.content) : utf8Bytes(f.content);
    if(typeof f.encoding !== "string") f.encoding = isTextExt(extOf(f.name)) ? "utf8" : "base64";
    if(typeof f.createdAt !== "string") f.createdAt = nowISO();
    if(typeof f.modifiedAt !== "string") f.modifiedAt = f.createdAt;
  });
  workspace.personalDrive.folders = workspace.personalDrive.folders
    .map((p)=> String(p||"").trim())
    .filter((p)=> p && !p.startsWith("/") && !p.endsWith("/") && !p.includes("//"))
    .filter((p, i, arr)=> arr.indexOf(p) === i);
  ["schedule","notes","notesTrash","contacts","meetings","shortcuts","apps","album"].forEach((k)=>{
    workspace[k].forEach((item)=>{ if(!item.id) item.id = uid(); }); });
  workspace.version = SCHEMA_VERSION;
  return workspace;
}

function removeDemoData(ws){
  const collections = ["schedule","notes","notesTrash","contacts","meetings","shortcuts","apps"];
  let removed = 0;
  collections.forEach((key)=>{
    if(!Array.isArray(ws[key])) return;
    const before = ws[key].length;
    ws[key] = ws[key].filter((item)=>!item.demo);
    removed += before - ws[key].length;
  });
  if(ws.home && Array.isArray(ws.home.widgets)){
    ws.home.widgets.forEach((w)=>{
      if(w.type==="todo" && Array.isArray(w.config.todos)){
        const before = w.config.todos.length;
        w.config.todos = w.config.todos.filter((t)=>!t.demo);
        removed += before - w.config.todos.length;
      }
    });
  }
  ws.settings.demoLoaded = false;
  return removed;
}

/* [E] UI KIT */
const UI = (() => {
  function toast(message, kind="info"){
    const host = $("#toasts"); if(!host) return;
    const el = document.createElement("div"); el.className = `toast ${kind}`;
    const iconName = kind==="error" ? "i-alert" : kind==="success" ? "i-check" : "i-info";
    el.innerHTML = `<svg class="ic" aria-hidden="true"><use href="#${iconName}"/></svg><span>${esc(message)}</span>`;
    host.appendChild(el);
    setTimeout(()=>{ el.style.transition="opacity .25s, transform .25s"; el.style.opacity="0"; el.style.transform="translateY(8px)";
      setTimeout(()=>el.remove(),260); }, kind==="error"?5200:2900);
  }
  function toastWithUndo(message, onUndo, ms=6000){
    const host = $("#toasts"); if(!host) return;
    const el = document.createElement("div"); el.className = "toast";
    el.innerHTML = `<svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg><span>${esc(message)}</span><button type="button" class="btn sm ghost undo-btn">Undo</button>`;
    const btn = $(".undo-btn", el); let dismissed=false;
    const dismiss = ()=>{ if(dismissed) return; dismissed=true;
      el.style.transition="opacity .25s, transform .25s"; el.style.opacity="0"; el.style.transform="translateY(8px)";
      setTimeout(()=>el.remove(),260); };
    btn.addEventListener("click", ()=>{ if(dismissed) return; dismissed=true; el.remove(); onUndo(); });
    host.appendChild(el); setTimeout(dismiss, ms);
  }
  let activeModal = null;
  function openModal(options){
    const { title, body, actions=[], wide=false, xwide=false, onMount=null, onClose=null, closeOnBackdrop=true } = options;
    closeModal();
    const previouslyFocused = document.activeElement;
    const backdrop = document.createElement("div"); backdrop.className="modal-backdrop";
    const sizeCls = xwide ? " xwide" : wide ? " wide" : "";
    backdrop.innerHTML = `
      <div class="modal${sizeCls}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head"><h2 id="modal-title">${esc(title)}</h2>
          <button type="button" class="icon-btn" data-modal-close aria-label="Close dialog"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot"></div>
      </div>`;
    const modalEl = $(".modal", backdrop); const footEl = $(".modal-foot", backdrop);
    const close = () => closeModal(backdrop);
    actions.forEach((action)=>{
      const btn = document.createElement("button"); btn.type="button";
      btn.className = `btn ${action.variant||""}`.trim(); btn.textContent = action.label;
      if(action.disabled) btn.disabled = true;
      btn.addEventListener("click", async ()=>{
        const result = action.onClick ? await action.onClick({ modal: modalEl, close }) : undefined;
        if(result !== false && action.closeOnClick !== false) close();
      });
      footEl.appendChild(btn);
      if(action.ref) action.ref.current = btn;
    });
    if(!actions.length) footEl.remove();
    backdrop.addEventListener("mousedown",(e)=>{ if(closeOnBackdrop && e.target===backdrop) closeModal(backdrop); });
    $$("[data-modal-close]", backdrop).forEach((btn)=>btn.addEventListener("click",()=>closeModal(backdrop)));
    backdrop.addEventListener("keydown",(e)=>{
      if(e.key!=="Tab") return;
      const f = $$('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', modalEl).filter((el)=>!el.disabled && el.offsetParent!==null);
      if(!f.length) return;
      const first=f[0], last=f[f.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    });
    $("#modal-root").appendChild(backdrop);
    activeModal = { backdrop, onClose, previouslyFocused };
    if(onMount) onMount({ modal: modalEl, close });
    const autofocus = $("[autofocus]", modalEl) || $("input, textarea, select", modalEl) || $("button:not([data-modal-close])", footEl);
    if(autofocus) setTimeout(()=>autofocus.focus(), 30);
    return { modal: modalEl, close };
  }
  function closeModal(whichBackdrop){
    if(!activeModal) return;
    if(whichBackdrop && activeModal.backdrop !== whichBackdrop) return;
    const { backdrop, onClose, previouslyFocused } = activeModal;
    activeModal = null; backdrop.remove();
    if(previouslyFocused && previouslyFocused.focus){ try{ previouslyFocused.focus(); }catch(e){} }
    if(onClose) onClose();
  }
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape" && activeModal){ e.preventDefault(); closeModal(); } });
  function confirm(options){
    const { title, message, confirmLabel="Confirm", cancelLabel="Cancel", danger=false } = options;
    return new Promise((resolve)=>{
      let settled=false;
      openModal({ title, body:`<p class="muted" style="line-height:1.6">${message}</p>`,
        actions:[
          { label:cancelLabel, variant:"ghost", onClick:()=>{ settled=true; resolve(false); } },
          { label:confirmLabel, variant:danger?"danger":"primary", onClick:()=>{ settled=true; resolve(true); } }
        ],
        onClose:()=>{ if(!settled) resolve(false); }
      });
    });
  }
  let savedResetTimer=null;
  function markSaving(){ const el=$("#save-status"); if(!el) return; clearTimeout(savedResetTimer); el.innerHTML = `<span class="dot busy"></span>Saving…`; }
  function markSaved(date){ const el=$("#save-status"); if(!el) return; el.innerHTML = `<span class="dot"></span>Saved ${fmtClock(date)}`;
    clearTimeout(savedResetTimer);
    savedResetTimer = setTimeout(()=>{ const cur=$("#save-status"); if(cur) cur.innerHTML = `<span class="dot"></span>All changes saved`; }, 4000); }
  function markSaveFailed(){ const el=$("#save-status"); if(el) el.innerHTML = `<span class="dot" style="background:var(--danger)"></span>Not saved`; }
  function icon(name, cls=""){ return `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`; }
  function emptyState(iconName, title, description, actionHtml=""){
    return `<div class="empty"><div class="icon-wrap">${icon(iconName,"ic-lg")}</div><div class="t">${esc(title)}</div><div class="d">${esc(description)}</div>${actionHtml}</div>`;
  }
  return { toast, toastWithUndo, openModal, closeModal, confirm, markSaving, markSaved, markSaveFailed, icon, emptyState };
})();

const Theme = {
  apply(theme){ const t = theme==="dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    const use = $("#theme-icon-use"); if(use) use.setAttribute("href", t==="dark" ? "#i-sun" : "#i-moon");
    const btn = $("#theme-toggle"); if(btn) btn.setAttribute("aria-label", t==="dark" ? "Switch to light theme" : "Switch to dark theme"); },
  current(){ return document.documentElement.getAttribute("data-theme")||"light"; },
  set(theme){ this.apply(theme); Store.setPrefs({theme});
    if(Store.data){ Store.data.settings.theme = theme; Store.save(); } },
  toggle(){ this.set(this.current()==="dark" ? "light" : "dark"); }
};

/* [G] IDLE LOCK */
const IdleLock = {
  timer:null, minutes:2, lastReset:0, bound:false,
  init(minutes){ this.minutes = typeof minutes==="number" ? minutes : 2;
    if(!this.bound){ const handler=()=>this.touch();
      ["mousemove","mousedown","keydown","touchstart","scroll","wheel"].forEach((evt)=>window.addEventListener(evt, handler, { passive:true }));
      this.bound = true; }
    this.touch(); },
  touch(){ if(this.minutes===0) return; const now=Date.now();
    if(now - this.lastReset < 1000) return; this.lastReset = now;
    clearTimeout(this.timer); this.timer = setTimeout(()=>lockWorkspace("auto"), this.minutes*60*1000); },
  stop(){ clearTimeout(this.timer); this.timer=null; },
  setMinutes(minutes){ this.minutes = minutes; if(minutes===0) this.stop(); else this.touch(); }
};

/* [H] ROUTER */
const Actions = {};
function registerActions(map){ Object.assign(Actions, map); }
document.addEventListener("click",(e)=>{
  const trigger = e.target.closest("[data-action]"); if(!trigger) return;
  const handler = Actions[trigger.dataset.action]; if(!handler) return;
  e.preventDefault();
  try{ handler(trigger, e); }catch(err){ console.error("[WaceSpork] Action '"+trigger.dataset.action+"' failed:", err); UI.toast("Something went wrong. See the browser console for details.","error"); }
});
document.addEventListener("keydown",(e)=>{
  if(e.key!=="Enter" && e.key!==" ") return;
  const trigger = e.target.closest('[data-action][role="button"]'); if(!trigger) return;
  e.preventDefault(); const handler = Actions[trigger.dataset.action];
  if(handler){ try{ handler(trigger, e); }catch(err){ console.error("[WaceSpork] Action failed:", err); } }
});

const SelectState = {
  active: { notes:false, contacts:false, album:false, shortcuts:false, apps:false, drive:false },
  selected: { notes:new Set(), contacts:new Set(), album:new Set(), shortcuts:new Set(), apps:new Set(), drive:new Set() }
};
function enterSelectMode(view){ SelectState.active[view] = true; SelectState.selected[view].clear(); refresh(); }
function exitSelectMode(view){ SelectState.active[view] = false; SelectState.selected[view].clear(); refresh(); }
function toggleSelectItem(view, id){
  const s = SelectState.selected[view];
  if(s.has(id)) s.delete(id); else s.add(id);
  refresh();
}
function selectAllInView(view, ids){
  const cur = SelectState.selected[view];
  if(cur.size === ids.length && ids.length > 0) cur.clear();
  else SelectState.selected[view] = new Set(ids);
  refresh();
}
function selectCheckHtml(checked){

    <span class="sb-count">${n} selected</span>
    <button type="button" class="btn sm ghost" data-action="sel.all" data-view="${view}">${allOn ? "Deselect all" : "Select all"}</button>
    ${extraActions || ""}
    <span class="sb-grow"></span>
    <button type="button" class="btn sm ghost" data-action="sel.cancel" data-view="${view}">Cancel</button>

}

const Router = {
  routes: ["home","schedule","notes","contacts","meetings","album","drive","shortcuts","apps","settings"],
  current: "home",
  go(route, opts={}){
    if(!this.routes.includes(route)) route="home";
    if(this.current === "album" && route !== "album"){ AlbumState.unlocked = false; }
    if(this.current === "notes" && route !== "notes"){ NotesState.unlocked = false; }
    if(this.current === "drive" && route !== "drive"){ DriveState.unlocked = false; }
    if(route === "album" && !AlbumState.unlocked){
      const targetOpts = { silent: !!opts.silent };
      promptPinFor("Unlock Personal Album", "Personal Album is private. Enter your current 6-digit PIN to continue.").then((ok)=>{
        if(ok){ AlbumState.unlocked = true; this.go(route, targetOpts); }
        else if(!targetOpts.silent && location.hash !== "#/" + this.current){ history.replaceState(null, "", "#/" + this.current); }
      });
      return;
    }
    if(route === "drive" && !DriveState.unlocked){
      const targetOpts = { silent: !!opts.silent };
      promptPinFor("Unlock Personal Drive", "Personal Drive is private. Enter your current 6-digit PIN to continue.").then((ok)=>{
        if(ok){ DriveState.unlocked = true; this.go(route, targetOpts); }
        else if(!targetOpts.silent && location.hash !== "#/" + this.current){ history.replaceState(null, "", "#/" + this.current); }
      });
      return;
    }
    if(route === "notes" && !NotesState.unlocked){
      const targetOpts = { silent: !!opts.silent };
      promptPinFor("Unlock Notepad", "Notepad is private. Enter your current 6-digit PIN to continue.").then((ok)=>{
        if(ok){ NotesState.unlocked = true; this.go(route, targetOpts); }
        else if(!targetOpts.silent && location.hash !== "#/" + this.current){ history.replaceState(null, "", "#/" + this.current); }
      });
      return;
    }
    this.current = route;
    if(Store.data && Store.data.settings && route !== "album" && route !== "drive" && route !== "notes"){
      Store.data.settings.lastView = route;
    }
    if(!opts.silent){ const hash = "#/" + route; if(location.hash!==hash) history.replaceState(null, "", hash); }
    renderView(); closeMobileNav();
  },
  readHash(){ const raw = (location.hash||"").replace(/^#\/?/,"").trim(); return this.routes.includes(raw) ? raw : "home"; },
  init(){
    window.addEventListener("hashchange", ()=>{ const route = this.readHash();
      if(route !== this.current){ this.go(route); } });
    const preferred = (Store.data && Store.data.settings && Store.data.settings.lastView) || this.readHash();
    let target = this.routes.includes(preferred) ? preferred : this.readHash();
    if(target === "album" || target === "drive" || target === "notes") target = "home";
    this.current = target;
    if(location.hash !== "#/"+this.current) history.replaceState(null, "", "#/"+this.current);
  }
};

function getNavOrder(){
  const stored = Store.prefs().navOrder;
  const reorderable = NAV_ITEMS.filter((i)=>i.route !== "settings").map((i)=>i.route);
  if(!Array.isArray(stored)) return reorderable.slice();
  const known = new Set(reorderable);
  const out = stored.filter((r)=>known.has(r));
  const seen = new Set(out);
  reorderable.forEach((r)=>{ if(!seen.has(r)) out.push(r); });
  return out;
}

function wireSidebarArrange(nav){
  const main = $("#nav-main", nav); if(!main) return;
  let draggingRoute = null;
  $$(".nav-item", main).forEach((item)=>{
    item.addEventListener("dragstart", (e)=>{
      draggingRoute = item.dataset.nav;
      item.classList.add("dragging");
      try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", draggingRoute); }catch(_){}
    });
    item.addEventListener("dragend", ()=>{
      item.classList.remove("dragging");
      $$(".nav-item", main).forEach((n)=>{ n.classList.remove("drag-over-top","drag-over-bottom"); });
      const newOrder = $$(".nav-item", main).map((n)=>n.dataset.nav);
      setNavOrder(newOrder);
      draggingRoute = null;
      renderSidebar();
    });
    item.addEventListener("dragover", (e)=>{
      if(!draggingRoute || item.dataset.nav === draggingRoute) return;
      e.preventDefault();
      try{ e.dataTransfer.dropEffect = "move"; }catch(_){}
      const dragged = main.querySelector(`[data-nav="${draggingRoute}"]`);
      if(!dragged) return;
      const rect = item.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      $$(".nav-item", main).forEach((n)=>n.classList.remove("drag-over-top","drag-over-bottom"));
      if(e.clientY < midY){
        main.insertBefore(dragged, item);
        item.classList.add("drag-over-top");
      } else {
        main.insertBefore(dragged, item.nextSibling);
        item.classList.add("drag-over-bottom");
      }
    });
  });
}

  sidebar.classList.toggle("compact", wantCompact);

function wireSidebarResize(){
  const sidebar = $("#sidebar"); if(!sidebar) return;
  const handle = $(".sidebar-resize-handle", sidebar); if(!handle) return;
  let resizing = false;
  handle.addEventListener("pointerdown", (e)=>{
    if(window.innerWidth <= 1080) return;
    if(sidebar.classList.contains("compact")) return;
    resizing = true; sidebar.classList.add("no-transition"); handle.classList.add("active");
    document.body.classList.add("resizing-sidebar");
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  handle.addEventListener("pointermove", (e)=>{
    if(!resizing) return;
    const rect = sidebar.getBoundingClientRect();
    const w = Math.max(180, Math.min(420, e.clientX - rect.left));
    sidebar.style.width = w + "px";
  });
  const endResize = (e)=>{
    if(!resizing) return;
    resizing = false; sidebar.classList.remove("no-transition"); handle.classList.remove("active");
    document.body.classList.remove("resizing-sidebar");
    try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
    const rect = sidebar.getBoundingClientRect(); const finalW = Math.round(rect.width);
    Store.setPrefs({ sidebarWidth: finalW });
    sidebar.style.width = finalW + "px";
  };
  handle.addEventListener("pointerup", endResize);
  handle.addEventListener("pointercancel", endResize);
}

function pickFile(accept, multiple=false){
  return new Promise((resolve)=>{
    const input = document.createElement("input");
    input.type = "file";
    if(accept) input.accept = accept;
    if(multiple) input.multiple = true;
    input.style.display = "none";
    document.body.appendChild(input);
    let settled = false;
    const finish = (files)=>{
      if(settled) return; settled = true;
      if(input.parentNode) input.remove();
      resolve(files || []);
    };
    input.addEventListener("change", ()=>{ const fs = Array.from(input.files||[]); finish(fs); });
    let cancelTimer = null;
    const onFocus = ()=>{ if(settled) return; clearTimeout(cancelTimer); cancelTimer = setTimeout(()=>finish([]), 500); };
    window.addEventListener("focus", onFocus, { once:true });
    setTimeout(()=>{ if(!settled) finish([]); }, 5 * 60 * 1000);
    try{ input.click(); }catch(e){ finish([]); }
  });
}
